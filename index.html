const FIGURES = { heart: HEART_FIG };

function runFigure(d){
  const fig = d.figure, parts = fig.parts;
  if (!session) session = { order: shuffle(parts.map(p => p.id)), i: 0, score: 0, picked: null, missed: [] };
  const s = session;

  if (s.i >= s.order.length){
    const pct = Math.round(s.score / s.order.length * 100);
    const prev = load()[d.id] || {};
    record(d.id, { figureBest: Math.max(prev.figureBest || 0, pct) });
    return results(d, `${s.score}/${s.order.length}`, `of ${s.order.length} structures found`, s.missed, 'figure');
  }

  const target = s.order[s.i], done = s.picked !== null;
  const targetPart = parts.find(p => p.id === target);

  app.innerHTML = `
    ${sessionBar(d, s.i, s.order.length, `Label the Diagram · ${s.score} correct`)}
    <div class="q">Where is the <b>${esc(target)}</b>?</div>
    <div class="figure">
      ${FIGURES[fig.name]}
      <svg class="leaders" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
        ${parts.filter(p => p.to).map(p => {
          const lit = done && p.id === target;
          const dim = done && !lit && p.id !== s.picked;
          return `<line x1="${p.x}" y1="${p.y}" x2="${p.to[0]}" y2="${p.to[1]}"
            class="${lit ? 'on' : ''} ${dim ? 'off' : ''}"/>`;
        }).join('')}
      </svg>
      ${parts.map(p => {
        let cls = '';
        if (done && p.id === target) cls = 'correct';
        else if (done && p.id === s.picked) cls = 'wrong';
        else if (done) cls = 'muted';
        return `<button class="dot ${cls}" style="left:${p.x}%;top:${p.y}%"
          ${done ? 'disabled' : ''} onclick="pickPart('${esc(p.id)}')"
          aria-label="${esc(p.id)}"></button>`;
      }).join('')}
    </div>
    ${done ? `<div class="why"><b>${esc(target)}:</b> ${esc(targetPart.about)}</div>
      <button class="next" onclick="nextPart()">
        ${s.i + 1 < s.order.length ? 'Next structure →' : 'See results →'}</button>` : ''}
    <p class="figcap">Cut-away anterior view — the patient faces you, so their right side is on your left.
      Blue is deoxygenated blood arriving, violet the pulmonary arteries leaving for the lungs,
      orange the pulmonary veins returning, red the oxygenated blood heading out. Arrows show flow.</p>
    <p class="figcredit">Diagram by Wnauta, after Wapcaplet ·
      <a href="https://commons.wikimedia.org/wiki/File:Diagram_of_the_human_heart_(clean).svg"
         target="_blank" rel="noopener">Wikimedia Commons</a> ·
      <a href="https://creativecommons.org/licenses/by-sa/3.0/"
         target="_blank" rel="noopener">CC BY-SA 3.0</a> · resized, labels are ours</p>`;
  keyHandler = e => { if (done && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); nextPart(); } };
}
function pickPart(id){
  const s = session;
  if (s.picked !== null) return;
  s.picked = id;
  const target = s.order[s.i];
  if (id === target) s.score++;
  else s.missed.push({ q: `You pointed at <b>${esc(id)}</b>`, a: target });
  render();
}
function nextPart(){ session.i++; session.picked = null; render(); }

/* ═══════════════ NAME THE RHYTHM ═══════════════ */
/* Recognising a strip is the actual clinical skill, and it is not the same
   skill as reciting a definition — you can know that A-fib has no identifiable
   P wave and still not spot it on paper. This mode shows only the tracing.

   No image is fetched or embedded: these are the same SVG paths the heartbeat
   animation draws, whose rates and regularity are checked by the test suite.
   That also means no copyright question and no weight added to the file. */
const tracedCards = d => d.cards.filter(c => c.trace && traceOf(c));
function runTrace(d){
  if (!session){
    const pool = tracedCards(d);
    const qs = shuffle(pool).map(card => {
      /* wrong answers ranked by how close their definitions sit, so the choices
         are rhythms that could plausibly be confused rather than obvious misses */
      const others = pool.filter(c => c !== card && !conflicts(c.def, card.def));
      const wrong = distractors(others, 3, c => c.term, [card.term], card.def);
      if (!wrong) return null;
      const choices = shuffle([card.term, ...wrong.map(c => c.term)]);
      return { card, choices, answer: choices.indexOf(card.term) };
    }).filter(Boolean);
    session = { qs, i: 0, score: 0, picked: null, missed: [] };
  }
  const s = session;
  if (!s.qs.length) return screenDeck();

  if (s.i >= s.qs.length){
    const pct = Math.round(s.score / s.qs.length * 100);
    const prev = load()[d.id] || {};
    record(d.id, { traceBest: Math.max(prev.traceBest || 0, pct) });
    return results(d, pct + '%', `${s.score} of ${s.qs.length} identified`, s.missed, 'trace');
  }

  const q = s.qs[s.i], done = s.picked !== null;
  app.innerHTML = `
    ${sessionBar(d, s.i, s.qs.length, `Name the Rhythm · ${s.score} correct`)}
    <div class="q">Which rhythm is this?</div>
    ${traceSvg(traceOf(q.card))}
    <div class="choices">
      ${q.choices.map((c, i) => {
        let cls = '';
        if (done && i === q.answer) cls = 'correct';
        else if (done && i === s.picked) cls = 'wrong';
        return `<button class="choice ${cls}" ${done ? 'disabled' : ''} onclick="answerTrace(${i})">
          <span class="k">${done && i === q.answer ? '✓' : done && i === s.picked ? '✕' : 'ABCD'[i]}</span>
          <span>${esc(c)}</span></button>`;
      }).join('')}
    </div>
    ${done ? `<div class="why"><b>${esc(q.card.term)}</b> — ${defHtml(q.card.def)}
        ${q.card.note ? `<span class="note">${esc(q.card.note)}</span>` : ''}</div>
      <button class="next" onclick="nextTrace()">
        ${s.i + 1 < s.qs.length ? 'Next tracing →' : 'See results →'}</button>` : ''}`;

  keyHandler = e => {
    if (!done && '1234'.includes(e.key)) answerTrace(+e.key - 1);
    else if (!done && 'abcd'.includes(e.key.toLowerCase())) answerTrace('abcd'.indexOf(e.key.toLowerCase()));
    else if (done && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); nextTrace(); }
  };
}
function answerTrace(i){
  const s = session;
  if (s.picked !== null) return;
  s.picked = i;
  const q = s.qs[s.i];
  if (i === q.answer) s.score++;
  else s.missed.push({ q: `You said <b>${esc(q.choices[i])}</b>`, a: q.card.term });
  render();
}
function nextTrace(){ session.i++; session.picked = null; render(); }

/* ═══════════════ SPOT THE SEGMENT ═══════════════ */
/* Naming the parts of a complex is examined by pointing at one and asking what
   it is, so that is what this does: two beats drawn large, one span highlighted.

   The fractions below are the SAME ones pqrst() draws with, which is what keeps
   the highlight sitting exactly on the feature it claims. Change one without the
   other and the band drifts off the wave — the test suite checks they agree. */
const ECG_PARTS = [
  { term: 'P wave',       from: .10, to: .25 },
  { term: 'PR segment',   from: .25, to: .46 },
  { term: 'PR interval',  from: .10, to: .46 },
  { term: 'QRS complex',  from: .46, to: .62 },
  { term: 'ST segment',   from: .62, to: .72 },
  { term: 'T wave',       from: .72, to: .89 },
  { term: 'QT interval',  from: .46, to: .89 },
  { term: 'TP segment',   from: .89, to: 1.10 },
  { term: 'J point',      from: .60, to: .64 },
];
const partCards = d => ECG_PARTS
  .map(p => ({ part: p, card: d.cards.find(c => c.term.toLowerCase() === p.term.toLowerCase()) }))
  .filter(x => x.card);

const PARTW = 190;   /* one complex, in viewBox units */
function partsSvg(part){
  const a = PARTW * part.from, b = PARTW * part.to;
  return `<svg viewBox="0 0 400 100" class="ecg partsvg" role="img" aria-label="ECG tracing with one span highlighted">
    <rect class="parthi" x="${a.toFixed(1)}" y="4" width="${(b - a).toFixed(1)}" height="78"/>
    <line x1="0" y1="60" x2="400" y2="60" class="ecgbase"/>
    <path d="M0,60 ${pqrst(0, PARTW)}${pqrst(PARTW, PARTW)}" class="ecgtrace"/>
    <path class="partbar" d="M${a.toFixed(1)},90 L${a.toFixed(1)},95 L${b.toFixed(1)},95 L${b.toFixed(1)},90"/>
  </svg>`;
}
function runParts(d){
  if (!session){
    const pool = partCards(d);
    const qs = shuffle(pool).map(({ part, card }) => {
      const others = pool.filter(o => o.card !== card);
      if (others.length < 3) return null;
      const choices = shuffle([card.term, ...sample(others, 3).map(o => o.card.term)]);
      return { part, card, choices, answer: choices.indexOf(card.term) };
    }).filter(Boolean);
    session = { qs, i: 0, score: 0, picked: null, missed: [] };
  }
  const s = session;
  if (!s.qs.length) return screenDeck();

  if (s.i >= s.qs.length){
    const pct = Math.round(s.score / s.qs.length * 100);
    const prev = load()[d.id] || {};
    record(d.id, { partsBest: Math.max(prev.partsBest || 0, pct) });
    return results(d, pct + '%', `${s.score} of ${s.qs.length} identified`, s.missed, 'parts');
  }

  const q = s.qs[s.i], done = s.picked !== null;
  app.innerHTML = `
    ${sessionBar(d, s.i, s.qs.length, `Spot the Segment · ${s.score} correct`)}
    <div class="q">Which part of the cycle is marked?</div>
    ${partsSvg(q.part)}
    <div class="choices">
      ${q.choices.map((c, i) => {
        let cls = '';
        if (done && i === q.answer) cls = 'correct';
        else if (done && i === s.picked) cls = 'wrong';
        return `<button class="choice ${cls}" ${done ? 'disabled' : ''} onclick="answerParts(${i})">
          <span class="k">${done && i === q.answer ? '✓' : done && i === s.picked ? '✕' : 'ABCD'[i]}</span>
          <span>${esc(c)}</span></button>`;
      }).join('')}
    </div>
    ${done ? `<div class="why"><b>${esc(q.card.term)}</b> — ${defHtml(q.card.def)}
        ${q.card.note ? `<span class="note">${esc(q.card.note)}</span>` : ''}</div>
      <button class="next" onclick="nextParts()">
        ${s.i + 1 < s.qs.length ? 'Next tracing →' : 'See results →'}</button>` : ''}`;

  keyHandler = e => {
    if (!done && '1234'.includes(e.key)) answerParts(+e.key - 1);
    else if (!done && 'abcd'.includes(e.key.toLowerCase())) answerParts('abcd'.indexOf(e.key.toLowerCase()));
    else if (done && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); nextParts(); }
  };
}
function answerParts(i){
  const s = session;
  if (s.picked !== null) return;
  s.picked = i;
  const q = s.qs[s.i];
  if (i === q.answer) s.score++;
  else s.missed.push({ q: `You said <b>${esc(q.choices[i])}</b>`, a: q.card.term });
  render();
}
function nextParts(){ session.i++; session.picked = null; render(); }

/* ═══════════════ TRUE / FALSE ═══════════════ */
/* A statement pairs a term with a definition and asks whether they belong
   together. The false half is where the difficulty lives: pairing a term with a
   definition drawn at random makes every false statement obvious, so the wrong
   definition is chosen from the same subject area, exactly as quiz distractors
   are. `conflicts` still guards it — a definition that could honestly describe
   the term would make a "false" statement actually true. */
function tfStatements(d){
  const pool = d.cards;
  if (pool.length < 4) return [];
  return pool.map(card => {
    const others = pool.filter(c => c !== card && !conflicts(c.def, card.def));
    if (!others.length) return null;
    /* half true, half false, decided per card */
    if (Math.random() < 0.5)
      return { card, def: card.def, answer: true };
    const wrong = distractors(others, 1, c => c.def, [card.def], card.def);
    return wrong ? { card, def: wrong[0].def, answer: false, actually: wrong[0].term } : null;
  }).filter(Boolean);
}
function runTF(d){
  if (!session){
    const all = tfStatements(d);
    session = { qs: sample(all, Math.min(20, all.length)), i: 0, score: 0, picked: null, missed: [] };
  }
  const s = session;

  if (!s.qs.length) return screenDeck();
  if (s.i >= s.qs.length){
    const pct = Math.round(s.score / s.qs.length * 100);
    const prev = load()[d.id] || {};
    record(d.id, { tfBest: Math.max(prev.tfBest || 0, pct) });
    return results(d, pct + '%', `${s.score} of ${s.qs.length} correct`, s.missed, 'tf');
  }

  const q = s.qs[s.i], done = s.picked !== null;
  const right = done && s.picked === q.answer;
  app.innerHTML = `
    ${sessionBar(d, s.i, s.qs.length, `True or False · ${s.score} correct`)}
    <div class="q" style="font-weight:400"><b>${esc(q.card.term)}</b> means:<br>${defHtml(q.def)}</div>
    <div class="row tfrow">
      <button class="tf ${done && q.answer === true ? 'correct' : ''} ${done && s.picked === true && !right ? 'wrong' : ''}"
        ${done ? 'disabled' : ''} onclick="answerTF(true)">True</button>
      <button class="tf ${done && q.answer === false ? 'correct' : ''} ${done && s.picked === false && !right ? 'wrong' : ''}"
        ${done ? 'disabled' : ''} onclick="answerTF(false)">False</button>
    </div>
    ${done ? `<div class="why" style="border-left-color:${right ? 'var(--good)' : 'var(--bad)'}">
        <b style="color:${right ? 'var(--good)' : 'var(--bad)'}">${right ? '✓ Correct' : '✗ Not quite'}</b><br>
        ${q.answer
          ? `That is the definition of <b>${esc(q.card.term)}</b>.`
          : `That is the definition of <b>${esc(q.actually)}</b>. <b>${esc(q.card.term)}</b> means ${esc(q.card.def)}`}
        ${q.card.note ? `<span class="note">${esc(q.card.note)}</span>` : ''}
      </div>
      <button class="next" onclick="nextTF()">${s.i + 1 < s.qs.length ? 'Next statement →' : 'See results →'}</button>` : ''}`;

  keyHandler = e => {
    if (!done && (e.key === 't' || e.key === 'T' || e.key === '1')) answerTF(true);
    else if (!done && (e.key === 'f' || e.key === 'F' || e.key === '2')) answerTF(false);
    else if (done && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); nextTF(); }
  };
}
function answerTF(v){
  const s = session;
  if (s.picked !== null) return;
  s.picked = v;
  const q = s.qs[s.i];
  if (v === q.answer) s.score++;
  else s.missed.push({ q: `<b>${esc(q.card.term)}</b> means: ${esc(q.def)}`,
                       a: q.answer ? 'True' : `False — that defines ${q.actually}` });
  render();
}
function nextTF(){ session.i++; session.picked = null; render(); }

function runQuiz(d){
  if (!session){
    const written = (d.questions || []).map(q => Object.assign({}, q, { written: true }));

    /* A card can produce two questions — "what does X mean" and "which term
       means X" — and being asked both in one sitting reads as a duplicate.
       Keep a single randomly chosen direction per card. */
    const byCard = new Map();
    autoQuestions(d).forEach(q => {
      if (!byCard.has(q.card)) byCard.set(q.card, []);
      byCard.get(q.card).push(q);
    });
    let auto = [...byCard.values()].map(qs => qs[Math.random() * qs.length | 0]);

    /* Drop generated questions that land on the same answer as a hand-written
       one (e.g. a written "which term means abnormal narrowing?" alongside the
       generated version of the same thing). */
    const spokenFor = new Set(written.map(q => q.choices[q.answer]));
    auto = auto.filter(q => !spokenFor.has(q.choices[q.answer]));

    const n = Math.min(20, written.length + auto.length);
    const picked = shuffle(written).slice(0, n)
      .concat(sample(auto, Math.max(0, n - written.length)));
    session = { qs: shuffle(picked).slice(0, n), i: 0, score: 0, picked: null, missed: [] };
  }
  const s = session;

  if (s.i >= s.qs.length){
    const pct = Math.round(s.score / s.qs.length * 100);
    const prev = load()[d.id] || {};
    record(d.id, { quizBest: Math.max(prev.quizBest || 0, pct) });
    return results(d, pct + '%', `${s.score} of ${s.qs.length} correct`, s.missed, 'quiz');
  }

  const q = s.qs[s.i], done = s.picked !== null;
  app.innerHTML = `
    ${sessionBar(d, s.i, s.qs.length, `Quiz · ${s.score} correct`)}
    <div class="q">${q.q}</div>
    <div class="choices">
      ${q.choices.map((c, i) => {
        let cls = '';
        if (done && i === q.answer) cls = 'correct';
        else if (done && i === s.picked) cls = 'wrong';
        return `<button class="choice ${cls}" ${done ? 'disabled' : ''} onclick="answer(${i})">
          <span class="k">${done && i === q.answer ? '✓' : done && i === s.picked ? '✕' : 'ABCD'[i]}</span>
          <span>${esc(c)}</span></button>`;
      }).join('')}
    </div>
    ${done && q.why ? `<div class="why"><b>Why:</b> ${esc(q.why)}</div>` : ''}
    ${done ? `<button class="next" onclick="nextQ()">${s.i + 1 < s.qs.length ? 'Next question →' : 'See results →'}</button>` : ''}`;

  keyHandler = e => {
    if (!done && '1234'.includes(e.key)) answer(+e.key - 1);
    else if (!done && 'abcd'.includes(e.key.toLowerCase())) answer('abcd'.indexOf(e.key.toLowerCase()));
    else if (done && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); nextQ(); }
  };
}
function answer(i){
  const s = session, q = s.qs[s.i];
  if (s.picked !== null || i >= q.choices.length) return;
  s.picked = i;
  if (i === q.answer) s.score++;
  else s.missed.push({ q: q.q, a: q.choices[q.answer] });
  render();
}
function nextQ(){ session.i++; session.picked = null; render(); }

/* ═══════════════ MATCHING ═══════════════ */
function runMatch(d){
  if (!session){
    session = { pool: shuffle(d.cards), round: [], left: [], right: [], sel: null,
                matched: 0, total: d.cards.length, start: Date.now(), wrong: 0 };
    dealMatch();
  }
  const s = session;

  if (!s.round.length && !s.pool.length){
    const secs = Math.round((Date.now() - s.start) / 1000);
    const prev = load()[d.id] || {};
    record(d.id, { matchBest: prev.matchBest ? Math.min(prev.matchBest, secs) : secs });
    return results(d, secs + 's', `all ${s.total} pairs matched · ${s.wrong} misses`, [], 'match');
  }

  app.innerHTML = `
    ${sessionBar(d, s.matched, s.total, `Matching · ${s.wrong} misses`)}
    <div class="matchgrid">
      <div class="mcol">${s.left.map((c, i) => btnMatch(c, i, 'L')).join('')}</div>
      <div class="mcol">${s.right.map((c, i) => btnMatch(c, i, 'R')).join('')}</div>
    </div>`;
  keyHandler = null;
}
function btnMatch(c, i, side){
  const s = session, key = side + i;
  const cls = c.done ? 'done' : (s.sel === key ? 'sel' : '') + (s.badKey === key ? ' bad' : '');
  return `<button class="mitem ${cls}" ${c.done ? 'disabled' : ''} onclick="pick('${side}',${i})">
    ${esc(side === 'L' ? c.term : c.def)}</button>`;
}
function dealMatch(){
  const s = session;
  s.round = s.pool.splice(0, 6);
  s.left  = s.round.map(c => ({ term: c.term, def: c.def, id: c.term }));
  s.right = shuffle(s.left);
  s.sel = null;
}
function pick(side, i){
  const s = session, item = (side === 'L' ? s.left : s.right)[i], key = side + i;
  if (item.done) return;
  if (!s.sel){ s.sel = key; s.selItem = item; return render(); }
  if (s.sel === key){ s.sel = null; s.selItem = null; return render(); }
  if (s.sel[0] === side){ s.sel = key; s.selItem = item; return render(); }

  if (s.selItem.id === item.id){
    s.left.forEach(x => { if (x.id === item.id) x.done = true; });
    s.right.forEach(x => { if (x.id === item.id) x.done = true; });
    s.matched++;
    s.sel = null; s.selItem = null;
    if (s.left.every(x => x.done)){ if (s.pool.length) dealMatch(); else s.round = []; }
    render();
  } else {
    s.wrong++; s.badKey = key; render();
    setTimeout(() => { session.badKey = null; session.sel = null; session.selItem = null; render(); }, 320);
  }
}

/* ═══════════════ PLACE THE LEADS ═══════════════ */
/* Anterior figure, patient facing the viewer: the patient's LEFT is on our
   RIGHT. viewBox is 200x240, so a dot at SVG x=128,y=101 is left:64%, top:42%.
   Arms and legs are drawn because the four limb electrodes go on them.        */
const TORSO = `<svg viewBox="0 0 200 240" aria-hidden="true">
  <g fill="var(--card)" stroke="var(--line)" stroke-width="1.7" stroke-linejoin="round">
    <path d="M90 10 h20 v22 h-20 Z"/>
    <path d="M61 156 L96 156 L93 232 L66 232 Z"/>
    <path d="M104 156 L139 156 L134 232 L107 232 Z"/>
    <path d="M53 48 C43 53 37 66 35 80 L30 146 L44 148 L48 86 C49 72 51 58 56 52 Z"/>
    <path d="M147 48 C157 53 163 66 165 80 L170 146 L156 148 L152 86 C151 72 149 58 144 52 Z"/>
    <path d="M110 28 C128 31 142 38 147 50 C152 64 152 78 151 92
             C150 112 145 130 141 146 L139 156 L61 156 L59 146
             C55 130 50 112 49 92 C48 78 48 64 53 50 C58 38 72 31 90 28 Z"/>
  </g>
  <g fill="none" stroke="var(--line)" stroke-linecap="round">
    <path d="M96 44 C85 39 72 41 62 50" stroke-width="1.9"/>
    <path d="M104 44 C115 39 128 41 138 50" stroke-width="1.9"/>
    <path d="M100 46 v70" stroke-width="2.8" opacity=".9"/>
    <g stroke-width="1" opacity=".4">
      <path d="M100 64 C84 64 70 70 62 79"/><path d="M100 64 C116 64 130 70 138 79"/>
      <path d="M100 78 C82 78 66 85 57 95"/><path d="M100 78 C118 78 134 85 143 95"/>
      <path d="M100 92 C80 92 62 100 53 111"/><path d="M100 92 C120 92 138 100 147 111"/>
      <path d="M100 106 C80 106 62 115 54 126"/><path d="M100 106 C120 106 138 115 146 126"/>
    </g>
  </g>
  <g stroke="var(--accent)" stroke-width=".9" stroke-dasharray="3 4" opacity=".45" fill="none">
    <path d="M125 50 v92"/><path d="M136 56 v86"/><path d="M148 64 v78"/>
  </g>
</svg>`;

function runChest(d){
  const leads = d.electrodes;
  if (!session) session = { order: shuffle(leads.map(l => l.id)), i: 0, score: 0, picked: null, missed: [] };
  const s = session;

  if (s.i >= s.order.length){
    const pct = Math.round(s.score / s.order.length * 100);
    const prev = load()[d.id] || {};
    record(d.id, { chestBest: Math.max(prev.chestBest || 0, pct) });
    return results(d, `${s.score}/${s.order.length}`, 'of 10 electrodes placed correctly', s.missed, 'chest');
  }

  const target = s.order[s.i], done = s.picked !== null;
  const targetLead = leads.find(l => l.id === target);

  app.innerHTML = `
    ${sessionBar(d, s.i, s.order.length, `Placement · ${s.score} correct`)}
    <div class="q">Where does <b>${target}</b> go?</div>
    <div class="torso">
      ${TORSO}
      ${leads.map(l => {
        let cls = '';
        if (done && l.id === target) cls = 'correct';
        else if (done && l.id === s.picked) cls = 'wrong';
        else if (done) cls = 'muted';
        return `<button class="dot ${cls}" style="left:${l.x}%;top:${l.y}%"
          ${done ? 'disabled' : ''} onclick="pickLead('${l.id}')">${done ? l.id : ''}</button>`;
      }).join('')}
    </div>
    ${done ? `<div class="why"><b>${target}:</b> ${esc(targetLead.landmark)}</div>
      <button class="next" onclick="nextLead()">${s.i + 1 < s.order.length ? 'Next lead →' : 'See results →'}</button>` : ''}
    <p style="color:var(--dim);font-size:12.5px;text-align:center;margin-top:16px">
      Patient is facing you — their right side is on your left. Dashed lines are the
      midclavicular, anterior axillary and midaxillary lines. Limb electrodes go on the
      fleshy outer upper arms and the fleshy inner lower legs.</p>`;
  keyHandler = e => { if (done && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); nextLead(); } };
}
function pickLead(id){
  const s = session;
  if (s.picked !== null) return;
  s.picked = id;
  const target = s.order[s.i];
  if (id === target) s.score++;
  else {
    const l = deckById(view.deck).electrodes.find(x => x.id === target);
    s.missed.push({ q: `Where does ${target} go?`, a: l.landmark });
  }
  render();
}
function nextLead(){ session.i++; session.picked = null; render(); }

/* ═══════════════ WATCH A HEARTBEAT ═══════════════ */
/* One cardiac cycle, told as seven phases. `t` is the fraction of the cycle at
   which each phase starts; the impulse travels from `from` to `to` across it,
   and `hold` marks the AV pause, where the impulse waits instead of moving. */
const BEAT = [
  /* `t` values are the WAVEFORM feature boundaries, not arbitrary slices. A step
     animates to the end of its own feature and parks there, so the playhead sits
     on what the narration is describing rather than on the next thing along. */
  { id:'sa', t:0, name:'The SA node fires', lit:['sa'], chamber:null,
    say:'The impulse starts in the sinoatrial node, high in the right atrium. This is the pacemaker — it sets the pace at 60–100 beats per minute, faster than anything below it.' },
  { id:'atria', t:0.10, name:'Atrial depolarization', lit:['sa','internodal'], chamber:'atria',
    say:'The impulse spreads across both atria through the internodal pathways, and they contract — topping the ventricles up before they fire.',
    wave:'This is the P wave.' },
  { id:'av', t:0.25, name:'The AV node holds', lit:['internodal','av'], chamber:null, hold:true,
    say:'Conduction slows to about 0.05 m/s here, the slowest anywhere in the heart, pausing roughly 0.1 second. That pause is the point: it lets the atria finish emptying before the ventricles contract.',
    wave:'The flat PR segment is this wait.' },
  { id:'his', t:0.46, name:'Down the bundle of His', lit:['av','his','branches'], chamber:null,
    say:'Released, the impulse races down the bundle of His and splits into the left and right bundle branches, which descend either side of the septum all the way to the apex at around 2 m/s.',
    wave:'The QRS complex begins.' },
  { id:'purkinje', t:0.54, name:'Ventricular depolarization', lit:['branches','purkinje'], chamber:'ventricles',
    say:'From the apex the Purkinje fibres sweep back UP through the ventricular walls at about 4 m/s — the fastest conduction in the system. Starting at the bottom is what lets the ventricles squeeze upward and drive blood out, rather than merely twitching.',
    wave:'This is the QRS complex.' },
  { id:'repol', t:0.62, name:'Ventricular repolarization', lit:[], chamber:'ventricles-relax',
    say:'The ventricles recover electrically and relax, refilling with blood ready for the next beat.',
    wave:'This is the T wave.' },
  { id:'rest', t:0.89, name:'Resting', lit:[], chamber:null,
    say:'The trace returns to the isoelectric baseline. The SA node is already building toward the next impulse.' },
];
/* waypoints the impulse travels between, in SVG coordinates */
/* The impulse tracks the real route: down the septum to the apex, then back UP
   the ventricular wall through the Purkinje network, then home to the SA node
   ready for the next beat. */
const BEAT_PATH = { sa:[100,66], av:[150,118], apex:[150,232] };
/* Nothing is conducting during rest, so the impulse is hidden there rather than
   gliding home — it simply reappears at the SA node when the next beat fires. */
const BEAT_LEG = { sa:['sa','sa'], atria:['sa','av'], av:['av','av'],
                   his:['av','apex'], purkinje:['apex','apex'],
                   repol:['apex','apex'], rest:['apex','apex'] };

const phaseAt = t => { let p = BEAT[0]; for (const q of BEAT) if (t >= q.t) p = q; return p; };
const phaseEnd = i => (i + 1 < BEAT.length ? BEAT[i + 1].t : 1);

const PURKINJE = [
  'M145 234 C122 222 100 196 88 158', 'M145 234 C128 226 114 206 106 180',
  'M145 234 C136 226 128 210 123 192', 'M155 234 C178 222 200 196 212 158',
  'M155 234 C172 226 186 206 194 180', 'M155 234 C164 226 172 210 177 192',
];
const heartSvg = fill => `<svg viewBox="0 0 300 300" class="heartsvg" aria-hidden="true">
  <!-- Outline, chambers and conduction move together as one body, so the whole
       heart can squeeze visibly without the chambers peeling off the outline.
       Labels sit outside it and stay put. -->
  <g class="heartbody">
  <!-- Muscle, drawn under the chambers and filling the whole silhouette. Without
       it a shrinking cavity just exposes the page behind the diagram; with it,
       the wall visibly thickens as the cavity draws in. -->
  <path class="myo" d="M150 45 C118 37 78 45 70 76 C62 104 64 122 68 142 C76 184 100 226 149 256
             C198 226 224 184 232 142 C236 122 238 104 230 76 C222 45 182 37 150 45 Z"/>
  <g class="chambers">
    <path class="ch atria-l" d="M150 48 C120 42 82 48 74 76 C68 98 70 110 74 118 L148 118 Z"/>
    <path class="ch atria-r" d="M150 48 C180 42 218 48 226 76 C232 98 230 110 226 118 L152 118 Z"/>
    <path class="ch vent-l"  d="M74 122 C78 172 100 216 148 250 L148 122 Z"/>
    <path class="ch vent-r"  d="M226 122 C222 172 200 218 152 250 L152 122 Z"/>
  </g>
  <g class="outline" fill="none" stroke="var(--line)" stroke-width="2">
    <path d="M150 45 C118 37 78 45 70 76 C62 104 64 122 68 142 C76 184 100 226 149 256
             C198 226 224 184 232 142 C236 122 238 104 230 76 C222 45 182 37 150 45 Z"/>
    <path d="M74 119 H226"/><path d="M150 119 V250"/>
  </g>
  <g class="conduct" fill="none" stroke-linecap="round">
    <path class="seg internodal" d="M100 66 Q122 94 148 116"/>
    <path class="seg his" d="M150 122 V158"/>
    <!-- Bundle branches run DOWN the septum to the apex, hugging it either side -->
    <path class="seg branches" d="M150 158 L145 230 M150 158 L155 230"/>
    <!-- Purkinje fibres sweep back UP the free walls from the apex. Each is
         drawn twice: a faint one that is always there as anatomy, and a bright
         one over it that fills from the apex outward, so the impulse spreads
         through the whole network at once rather than one dot picking a fibre. -->
    ${PURKINJE.map(d => `<path class="seg purkinje" d="${d}"/>`).join('')}
    ${PURKINJE.map(d => `<path class="purkinje-live" d="${d}" pathLength="100"
        style="stroke-dashoffset:${(100 - fill * 100).toFixed(1)}"/>`).join('')}
    <circle class="node sa" cx="100" cy="66" r="7"/>
    <circle class="node av" cx="150" cy="118" r="7"/>
  </g>
  <!-- labels sit outside the chambers with leader lines, so a contracting
       chamber never slides out from under its own caption -->
  </g>
  <g class="leaders" stroke="var(--line)" stroke-width=".8" fill="none" opacity=".8">
    <path d="M236 130 L160 148"/><path d="M240 186 L206 182"/><path d="M64 214 L142 206"/>
  </g>
  <g class="beatlabels" font-size="9" fill="var(--dim)">
    <text x="88" y="52" text-anchor="end">SA node</text>
    <text x="163" y="112">AV node</text>
    <text x="240" y="122">Bundle</text>
    <text x="240" y="132">of His</text>
    <text x="244" y="189">Purkinje</text>
    <text x="60" y="211" text-anchor="end">Bundle</text>
    <text x="60" y="221" text-anchor="end">branches</text>
  </g>
</svg>`;

/* ---- ECG traces ------------------------------------------------------------
   Each rhythm is drawn over a 400-unit window representing about two and a half
   seconds, so a faster rhythm genuinely shows more complexes in the same space.

   That 2.5 is load-bearing, not decorative: it is what converts complex count
   into the BPM each rhythm claims. At 2.5 s, 2 complexes = 48 BPM, 3 = 72,
   5 = 120, 7 = 168, 9 = 216 — every rhythm then lands inside its stated range.
   This comment previously said three seconds, which put sinus tachycardia at
   exactly 100 ("above 100 BPM") and ventricular tachycardia at 140, below its
   own stated 150–250. test/app.test.js checks the arithmetic both ways, so
   changing this number without changing the traces fails the suite. One
   PQRST is generated from a start x and a width; pathLength="100" normalises
   whatever comes out, so revealing the trace is just a dash offset.          */
const BASE = 60;
/* The fractions below are deliberately aligned to the BEAT phase boundaries, so
   the narration always describes the part of the trace being drawn: P wave over
   the 'atria' phase (.09–.26), the flat PR segment over the AV hold (.26–.46),
   QRS over his+purkinje (.46–.71), T over repolarization (.71–.90). Changing one
   without the other puts the words out of step with the waveform. */
function pqrst(x, w, o = {}){
  const at = k => (x + w * k).toFixed(1);
  let d = '';
  d += o.noP ? `L${at(.25)},${BASE} `
             : `L${at(.10)},${BASE} Q${at(.175)},44 ${at(.25)},${BASE} `;
  d += `L${at(.46)},${BASE} `;                                   /* PR segment: the AV hold */
  if (o.spike) d += `L${at(.455)},22 L${at(.46)},${BASE} `;      /* pacing spike */
  d += o.wide ? `L${at(.47)},72 L${at(.56)},20 L${at(.65)},74 L${at(.70)},${BASE} `
              : `L${at(.48)},66 L${at(.54)},14 L${at(.59)},74 L${at(.62)},${BASE} `;
  d += o.noT ? `L${at(1)},${BASE} `
             : `L${at(.72)},${BASE} Q${at(.805)},38 ${at(.89)},${BASE} L${at(1)},${BASE} `;
  return d;
}
/* A ventricular ectopic beat gets its own shape rather than a variant of the
   normal one. Starting in the ventricle, it misses the fast Purkinje network
   and spreads muscle-to-muscle, so the complex is broad and points the opposite
   way — that contrast against the neighbouring beats IS the teaching point. */
function ectopic(x, w){
  const at = k => (x + w * k).toFixed(1);
  return `L${at(.10)},${BASE} L${at(.20)},44 L${at(.40)},108 L${at(.58)},42 L${at(.72)},${BASE} L${at(1)},${BASE} `;
}
/* an atrial ectopic beat: normal QRS, but the P is early and mis-shapen */
function atrialEctopic(x, w){
  const at = k => (x + w * k).toFixed(1);
  return `L${at(.08)},${BASE} L${at(.14)},70 Q${at(.19)},48 ${at(.24)},${BASE} `
       + `L${at(.40)},${BASE} L${at(.44)},66 L${at(.49)},18 L${at(.54)},74 L${at(.59)},${BASE} `
       + `L${at(.68)},${BASE} Q${at(.78)},40 ${at(.88)},${BASE} L${at(1)},${BASE} `;
}
/* evenly spaced beats across the window */
function regular(n, o = {}){
  const w = 400 / n;
  let d = `M0,${BASE} `;
  for (let i = 0; i < n; i++) d += pqrst(i * w, w, o);
  return d;
}
/* a chaotic wobble — used for fibrillation, where there is no organised complex */
function chaos(amp, step, seed = 1){
  let d = `M0,${BASE} `, r = seed;
  for (let x = step; x <= 400; x += step){
    r = (r * 9301 + 49297) % 233280;
    d += `L${x},${(BASE - amp / 2 + (r / 233280) * amp).toFixed(1)} `;
  }
  return d;
}

const RHYTHMS = [
  /* `cycles` is how many complexes fit the window — that is what makes rate
     visible — and the conduction phases repeat once per complex, so the
     narration stays lined up with whichever beat is being drawn. */
  { id:'nsr', name:'Normal sinus rhythm', rate:'60–100 BPM', sinus:true, heart:'normal', cycles:3,
    path: regular(3),
    say:'Every impulse starts in the SA node and takes the normal path. P wave, QRS and T wave in order, evenly spaced.' },

  { id:'brady', name:'Sinus bradycardia', rate:'below 60 BPM', sinus:true, heart:'normal', cycles:2,
    path: regular(2),
    say:'The same normal sequence, just slower — fewer complexes across the same stretch of paper. Everything is where it should be; there is simply less of it.' },

  { id:'tachy', name:'Sinus tachycardia', rate:'above 100 BPM', sinus:true, heart:'normal', cycles:5,
    path: regular(5),
    say:'The same normal sequence, sped up. The complexes crowd together and the baseline between them shortens.' },

  { id:'pac', name:'Premature atrial contraction', rate:'an early beat', heart:'ectopic-atrial',
    path: (() => { let d = `M0,${BASE} `;
      d += pqrst(0, 105);                 /* normal */
      d += atrialEctopic(105, 78);        /* early beat, differently shaped P */
      d += `L200,${BASE} `;               /* short pause */
      d += pqrst(200, 105) + pqrst(305, 105); return d; })(),
    say:'A cycle arrives before the next one is due, and its P wave is shaped differently because the impulse started somewhere in the atria other than the SA node. Common in healthy people who smoke or use stimulants, though it can point at something more serious.' },

  { id:'pat', name:'Paroxysmal atrial tachycardia', rate:'160–250 BPM', heart:'ectopic-atrial',
    path: regular(9, { noT:true }),
    say:'A sudden burst of very rapid atrial beats, lasting only momentarily. Patients describe it as a flutter in the chest. Seen in healthy people as well as in cardiac disease.' },

  { id:'afib', name:'Atrial fibrillation', rate:'atria 400–500 BPM', heart:'atrial-quiver',
    /* Irregularly irregular is THE recognition feature of A-fib, so the R-R
       gaps are deliberately uneven — 78, 122, 96 units, a coefficient of
       variation of 0.18. They were 96/114/90 (CV 0.10), which measured as
       regular and taught the wrong thing. Complexes are narrow, because
       conduction below the AV node is normal; it is the atria that are chaotic,
       which is the quivering baseline underneath. */
    path: (() => { const w = [0, 78, 200, 296]; let d = chaos(7, 8, 7);
      w.forEach(x => { d += `M${x},${BASE} ` + pqrst(x, 72, { noP:true }); }); return d; })(),
    say:'Multiple signals fire chaotically from the atria outside the SA node, so no P wave can be identified — just small irregular complexes on a quivering baseline. The ventricles respond irregularly, which is why the pulse is uneven.',
    note:'The 400–500 figure is the ATRIAL rate. The AV node blocks most of those impulses, so the pulse is far slower.' },

  { id:'pvc', name:'Premature ventricular contraction', rate:'an early wide beat', heart:'ectopic-vent',
    path: (() => { let d = `M0,${BASE} `;
      d += pqrst(0, 95);                  /* normal */
      d += ectopic(95, 88);               /* early, wide, opposite deflection */
      d += `L238,${BASE} `;               /* the compensatory pause */
      d += pqrst(238, 95) + pqrst(333, 95); return d; })(),
    say:'A beat fires early from inside the ventricle itself, so it bypasses the normal pathway and the QRS comes out wide and bizarre. A compensatory pause follows before the next normal beat.' },

  { id:'vtach', name:'Ventricular tachycardia', rate:'150–250 BPM', heart:'ectopic-vent', danger:true,
    path: (() => { const w = 400 / 7; let d = `M0,${BASE} `;
      for (let i = 0; i < 7; i++) d += ectopic(i * w, w); return d; })(),
    say:'Three or more PVCs in a row. No P waves, and the QRS complexes are wide and imprecise. Life threatening — it often appears during a myocardial infarction.' },

  { id:'vfib', name:'Ventricular fibrillation', rate:'no effective rate', heart:'vent-quiver', danger:true,
    path: chaos(46, 9, 3),
    say:'An erratic, jagged rhythm, sometimes called a sawtooth. The ventricles tremor rather than pump, so there is NO cardiac output. Alert the provider immediately.' },

  { id:'paced', name:'Pacemaker rhythm', rate:'set by the device', heart:'normal',
    path: regular(3, { spike:true, wide:true }),
    say:'Sharp vertical spikes mark the pacemaker firing, each one followed by the complex it triggered. More visible in unipolar than in bipolar leads.' },
];

/* Everything derived from the clock, in one place, so the full render and the
   per-frame repaint can never disagree about where the impulse is. */
function beatState(){
  const s = session, R = RHYTHMS[s.rhythm], cycles = R.cycles || 1;
  const ct = (s.t * cycles) % 1;
  let i, ph, k;
  if (R.sinus && s.walk){
    /* the stepped walkthrough owns which phase is showing, so the narration
       cannot drift away from the impulse the way deriving it from t would */
    i = Math.min(s.stepIdx, BEAT.length - 1); ph = BEAT[i]; k = s.k;
  } else {
    /* Run-out, and the arrhythmias: take the phase from where the trace has
       reached. Each remaining complex is another heartbeat, so the impulse
       keeps travelling the pathway rather than parking at the apex. */
    i = BEAT.indexOf(phaseAt(ct)); ph = BEAT[i];
    const span = phaseEnd(i) - ph.t;
    k = span > 0 ? Math.min(1, Math.max(0, (ct - ph.t) / span)) : 0;
  }
  const [a, b] = BEAT_LEG[ph.id], p0 = BEAT_PATH[a], p1 = BEAT_PATH[b];
  /* how far the Purkinje network has filled: spreading during its own phase,
     fully lit while the ventricles repolarise, dark otherwise */
  const fill = ph.id === 'purkinje' ? k : (ph.id === 'repol' ? 1 : 0);
  return { R, cycles, i, ph, fill,
           x: p0[0] + (p1[0] - p0[0]) * k, y: p0[1] + (p1[1] - p0[1]) * k,
           holding: R.sinus && s.walk && s.dwell > 0 };
}

/* What a full re-render would change. While this is stable, the frame loop
   repaints attributes instead of replacing the markup — otherwise every button
   on the page is torn out from under the pointer 60 times a second and no
   click can ever complete. */
function beatSig(){
  const s = session, b = beatState();
  return [s.rhythm, s.walk, s.beat, s.stepIdx, b.ph.id, b.holding, s.playing, s.speed].join('|');
}
function paintBeat(){
  const s = session, b = beatState(), px = (s.t * 400).toFixed(2);
  const set = (sel, fn) => { const el = document.querySelector(sel); if (el) fn(el); };
  set('#ecgclip rect', el => el.setAttribute('width', px));
  set('.ecgnow', el => { el.setAttribute('x1', px); el.setAttribute('x2', px); });
  set('.bar .prog i', el => el.style.width = (s.t * 100) + '%');
  set('.dwell i', el => el.style.width = (b.holding ? (s.dwell / DWELL) * 100 : 0) + '%');
  set('.impulse', el => { el.style.left = (b.x / 3) + '%'; el.style.top = (b.y / 3) + '%'; });
  document.querySelectorAll('.purkinje-live').forEach(el =>
    el.style.strokeDashoffset = (100 - b.fill * 100).toFixed(1));
}

function runBeat(d){
  if (!session) session = { t: 0, playing: true, speed: 1, last: 0, rhythm: 0,
                            walk: true, beat: 0, stepIdx: 0, k: 0, dwell: 0 };
  const s = session;
  const R = RHYTHMS[s.rhythm];
  const cycles = R.cycles || 1;

  /* The conduction walkthrough only makes sense while the impulse still takes
     the normal path. For the arrhythmias the pathway story breaks down, so the
     narration switches to the rhythm itself and the heart shows its behaviour. */
  const { i, ph, x, y, holding, fill } = beatState();

  app.innerHTML = `
    <button class="back" onclick="go('deck','${d.id}')">← ${esc(d.title)}</button>
    <div class="bar"><span>${esc(R.name)}</span>
      <div class="prog"><i style="width:${s.t * 100}%"></i></div>
      <span>${esc(R.rate)}</span></div>

    <div class="rhythms">
      ${RHYTHMS.map((q, n) => `<button class="rbtn ${n === s.rhythm ? 'on' : ''} ${q.danger ? 'danger' : ''}"
        onclick="beatRhythm(${n})">${esc(q.name)}</button>`).join('')}
    </div>

    <div class="beatwrap">
      <div class="heart ${R.sinus && ph.chamber ? 'x-' + ph.chamber : ''} ${R.sinus && ph.hold && holding ? 'holding' : ''} h-${R.heart}"
           data-lit="${R.sinus ? ph.lit.join(' ') : ''}">
        ${heartSvg(fill)}
        ${R.sinus && ph.id !== 'rest' ? `<span class="track"><span class="impulse ${holding && ph.hold ? 'held' : ''}"
              style="left:${x / 3}%;top:${y / 3}%"></span></span>` : ''}
      </div>

      <svg viewBox="0 0 400 90" class="ecg">
        <defs><clipPath id="ecgclip"><rect x="0" y="0" width="${(s.t * 400).toFixed(2)}" height="90"/></clipPath></defs>
        <line x1="0" y1="60" x2="400" y2="60" class="ecgbase"/>
        <!-- Clipped by X, not revealed by stroke-dashoffset. Dash offset measures
             PATH LENGTH, and a steep QRS packs a lot of length into very little
             width, so the trace ran ahead of the playhead. -->
        <path d="${R.path}" class="ecgtrace ${R.danger ? 'danger' : ''}" clip-path="url(#ecgclip)"/>
        <line x1="${(s.t * 400).toFixed(2)}" y1="4" x2="${(s.t * 400).toFixed(2)}" y2="86" class="ecgnow"/>
      </svg>
    </div>

    ${R.sinus && s.walk
      ? `<div class="phasehead">${esc(ph.name)}
           <span class="stepno">beat ${s.beat + 1} of ${cycles} · step ${i + 1} of ${BEAT.length}</span>
           ${ph.hold ? '<span class="pause">— the AV node is waiting here</span>' : ''}</div>
         <p class="phasesay">${esc(ph.say)}${ph.wave ? ` <span class="eg">${esc(ph.wave)}</span>` : ''}</p>
         <div class="dwell"><i style="width:${holding ? (s.dwell / DWELL) * 100 : 0}%"></i></div>`
      : R.sinus
      ? `<div class="phasehead">${esc(ph.name)}
           <span class="stepno">running at ${esc(R.rate)}</span></div>
         <p class="phasesay">${esc(R.say)}</p>`
      : `<div class="phasehead">${esc(R.name)}${R.danger ? ' <span class="pause">— life threatening</span>' : ''}</div>
         <p class="phasesay">${esc(R.say)}${R.note ? `<span class="note">${esc(R.note)}</span>` : ''}</p>`}

    <div class="row">
      <button onclick="beatToggle()">${s.playing ? '❚❚ Pause' : '▶ Play'}</button>
      <button onclick="beatRestart()">↺ Restart</button>
      <button onclick="beatSpeed()">Speed ${s.speed}×</button>
      ${R.sinus ? `<button onclick="beatWalk()"
        style="${s.walk ? '' : 'border-color:var(--accent);color:var(--accent)'}">
        ${s.walk ? '▷ Just play it' : '⤷ Walk the steps'}</button>` : ''}
    </div>

    ${R.sinus && s.walk ? `<div class="steps" style="margin-top:14px">
      ${BEAT.map((q, n) => `<button class="step" style="${q.id === ph.id ? 'border-color:var(--accent)' : ''}"
        onclick="beatSeek(${n})"><b style="color:var(--accent)">${n + 1}</b> &nbsp;${esc(q.name)}</button>`).join('')}
    </div>` : ''}`;

  keyHandler = e => { if (e.key === ' '){ e.preventDefault(); beatToggle(); } };
  if (s.playing) scheduleBeat();
}
function beatRhythm(n){
  Object.assign(session, { rhythm:n, t:0, last:0, beat:0, stepIdx:0, k:0, dwell:0 });
  render();
}
/* Two ways to watch it: stepped, holding on each phase to read; or just running,
   which is what a heart actually does. */
function beatWalk(){
  Object.assign(session, { walk: !session.walk, t:0, last:0, beat:0, stepIdx:0, k:0, dwell:0 });
  render();
}
function beatRestart(){
  Object.assign(session, { t:0, last:0, beat:0, stepIdx:0, k:0, dwell:0 });
  render();
}
/* Conduction phases play as STEPS, not as a continuous sweep: each one animates
   briefly, then holds while you read it. Sweeping through at a readable pace
   would take a minute an unbroken; holding is what makes it legible. */
const ANIM = 0.9, DWELL = 6;   /* seconds to move, then seconds to dwell */
/* One pass across the strip when simply playing. The number of complexes then
   sets the rate on its own: 2 across 2.4s reads ~50 BPM, 3 ~75, 5 ~125. */
const LIVE_SWEEP = 2.4;

/* The frame loop MUST break the render cycle: runBeat schedules a tick, the tick
   advances and re-renders. Calling the tick directly from runBeat would recurse
   until the stack blew. One frame may be in flight at a time. */
function scheduleBeat(){
  const s = session;
  if (!s || s.raf) return;
  s.raf = true;
  requestAnimationFrame(() => {
    if (!session) return;
    session.raf = false;
    if (view.mode !== 'beat' || !session.playing) return;
    const now = Date.now();
    const dt = Math.min(0.1, session.last ? (now - session.last) / 1000 : 0);
    session.last = now;
    const before = beatSig();
    if (RHYTHMS[session.rhythm].sinus && session.walk) stepBeat(dt); else sweepBeat(dt);
    /* Re-render only when the markup would actually differ; otherwise nudge the
       few moving attributes and leave the buttons where the pointer found them. */
    if (beatSig() !== before) render();
    else { paintBeat(); scheduleBeat(); }
  });
}
/* arrhythmias have one description for the whole strip — just draw it steadily */
function sweepBeat(dt){
  const s = session;
  s.t += dt * (1 / LIVE_SWEEP) * s.speed;
  if (s.t >= 1) s.t = 0;
}
/* Every complex on the strip gets the same seven-step walkthrough — a second
   beat is not a lesser beat, and rushing the later ones taught nothing. */
function stepBeat(dt){
  const s = session, R = RHYTHMS[s.rhythm], cycles = R.cycles || 1;
  const d = dt * s.speed;

  if (s.dwell > 0){
    s.dwell = Math.max(0, s.dwell - d);
    if (s.dwell === 0){
      if (s.stepIdx + 1 < BEAT.length){ s.stepIdx++; s.k = 0; }
      else if (s.beat + 1 < cycles){ s.beat++; s.stepIdx = 0; s.k = 0; }
      else { s.beat = 0; s.stepIdx = 0; s.k = 0; }      /* strip finished — loop */
    }
  } else {
    s.k = Math.min(1, s.k + d / ANIM);
    if (s.k === 1) s.dwell = DWELL;
  }
  const ph = BEAT[s.stepIdx];
  s.t = (s.beat + ph.t + (phaseEnd(s.stepIdx) - ph.t) * s.k) / cycles;
}
function beatToggle(){ session.playing = !session.playing; session.last = 0; render(); }
function beatSeek(n){
  const s = session;
  Object.assign(s, { stepIdx:n, k:1, dwell:DWELL, last:0 });
  const cycles = RHYTHMS[s.rhythm].cycles || 1;
  s.t = (s.beat + phaseEnd(n)) / cycles;
  render();
}
function beatSpeed(){ const o = [1, 0.5, 0.25, 2]; session.speed = o[(o.indexOf(session.speed) + 1) % o.length]; render(); }

/* ═══════════════ PUT IN ORDER ═══════════════ */
/* Steps are worked in stages so the screen stays short on a phone: as items
   move from the pool into the placed list the total on screen stays at STAGE. */
const STAGE = 6;
const stageCount = d => Math.ceil(d.steps.length / STAGE);
const stageSteps = (d, i) => d.steps.slice(i * STAGE, (i + 1) * STAGE);

function runOrder(d){
  if (!session) session = { stage: 0, remaining: shuffle(stageSteps(d, 0)), placed: [],
                            done: 0, misses: 0, start: Date.now(), bad: null };
  const s = session;

  if (s.done >= d.steps.length){
    const secs = Math.round((Date.now() - s.start) / 1000);
    const prev = load()[d.id] || {};
    record(d.id, { orderBest: prev.orderBest != null ? Math.min(prev.orderBest, s.misses) : s.misses });
    return results(d, String(s.misses),
      `misses placing ${d.steps.length} steps in order · ${secs}s`, [], 'order');
  }

  const first = s.stage * STAGE + 1;
  const last = Math.min((s.stage + 1) * STAGE, d.steps.length);
  app.innerHTML = `
    ${sessionBar(d, s.done, d.steps.length,
       `Put in Order · <span style="color:${s.misses ? 'var(--bad)' : 'var(--dim)'}">${s.misses} misses</span>`)}
    <div class="stagehead">Stage ${s.stage + 1} of ${stageCount(d)}
      <span>steps ${first}–${last}</span></div>
    ${s.placed.length ? `<ol class="placed">${s.placed.map((st, i) => {
       /* The detail belongs to the step just placed, so it hangs off that list
          item as a tinted panel. Floating it above the pool made it look like a
          clickable option. */
       const showWhy = i === s.placed.length - 1 && st.detail;
       return `<li class="${showWhy ? 'current' : ''}">
         <div class="row"><b>${first + i}</b><span>${esc(st.text)}</span></div>
         ${showWhy ? `<div class="detail">${esc(st.detail)}</div>` : ''}</li>`;
     }).join('')}</ol>` : ''}
    <div class="q">What is step <b>${s.done + 1}</b>?</div>
    <div class="steps">
      ${s.remaining.map((st, i) =>
        `<button class="step ${s.bad === i ? 'bad' : ''}" onclick="placeStep(${i})">${esc(st.text)}</button>`
      ).join('')}
    </div>`;
  keyHandler = null;
}
function placeStep(i){
  const s = session, d = deckById(view.deck);
  if (s.bad !== null) return;
  const step = s.remaining[i];

  if (step !== d.steps[s.done]){
    s.misses++;
    s.bad = i;
    render();
    return setTimeout(() => { if (session) { session.bad = null; render(); } }, 340);
  }

  s.remaining.splice(i, 1);
  s.placed.push(step);
  s.done++;

  if (!s.remaining.length && s.done < d.steps.length){   /* on to the next stage */
    s.stage++;
    s.remaining = shuffle(stageSteps(d, s.stage));
    s.placed = [];
  }
  render();
}

/* ═══════════════ BROWSE ═══════════════ */
/* ═══════════════ WHOLE CHAPTER SHEET ═══════════════ */
/* Every deck sharing a course and a chapter, in one table. Studying Chapter 1
   otherwise means bouncing between five decks; this is the one place to read it
   all straight through. The per-deck Review Sheet stays exactly as it is — for
   a study guide that is the tested scope, and collapsing it into the chapter
   would lose that distinction. */
/* Decks of a chapter, study guides first — the tested scope leads, same order
   the home screen uses. Only decks that actually hold terms: a procedure is a
   numbered sequence, and it would contribute a heading with nothing under it
   while inflating the deck count in the subtitle. */
const chapterDecks = d => (d.group
  ? DECKS.filter(o => o.course === d.course && o.group === d.group && o.cards.length)
         .slice().sort((a, b) => (b.exam ? 1 : 0) - (a.exam ? 1 : 0))
  : (d.cards.length ? [d] : []));
/* the deck name shown against a row — trimmed of the chapter prefix the heading
   already states, so it stays narrow and scannable */
const shortDeck = t => t.replace(/^Ch\.\s*\d+\s*[—-]\s*/, '').replace(/^[^—-]*[—-]\s*/, '');
const alphaKey = t => t.toLowerCase().replace(/^[^a-z0-9]+/, '');
function chapterOrder(v){ session.bydeck = v; render(); }

function runChapter(d){
  if (!session) session = { hide: false, filter: '', bydeck: false };
  const s = session;
  const f = s.filter.toLowerCase();
  const decks = chapterDecks(d);
  const hit = c => !f || (c.term + ' ' + c.def).toLowerCase().includes(f);

  const cell = c => `<td class="t">${esc(c.term)}</td>
    <td class="${s.hide ? 'hidden-def' : ''}" onclick="this.classList.remove('hidden-def')">
      ${defHtml(c.def)}${c.note && !s.hide ? `<span class="note">${esc(c.note)}</span>` : ''}</td>`;

  let body = '', shown = 0, total = 0;

  if (s.bydeck){
    /* Grouped by deck, so word parts of a kind stay together — every prefix in
       one block rather than scattered through the alphabet. Nothing is merged
       here: a term in two decks belongs under BOTH headings, which is the whole
       point of reading it this way. The source column goes, since the heading
       above each block already says it. */
    for (const deck of decks){
      const rows = deck.cards.filter(hit).sort((a, b) => alphaKey(a.term).localeCompare(alphaKey(b.term)));
      total += deck.cards.length;
      if (!rows.length) continue;
      shown += rows.length;
      body += `<tr class="secthead"><td colspan="2">${esc(shortDeck(deck.title))}
        <span>${rows.length} term${rows.length > 1 ? 's' : ''}</span></td></tr>`;
      body += rows.map(c => `<tr>${cell(c)}</tr>`).join('');
    }
  } else {
    /* Straight A–Z across the chapter. One term can legitimately appear in
       several decks — notes re-covering a lecture, a study guide restating a
       word list — so identical entries collapse to one row naming both sources,
       while genuinely different wordings stay separate and labelled. */
    const seen = new Map();
    for (const deck of decks)
      for (const c of deck.cards){
        const k = (c.term + '|' + c.def).toLowerCase();
        if (seen.has(k)) seen.get(k).from.push(deck.title);
        else seen.set(k, { card: c, from: [deck.title] });
      }
    const all = [...seen.values()].sort((a, b) => alphaKey(a.card.term).localeCompare(alphaKey(b.card.term)));
    total = all.length;
    const rows = all.filter(r => hit(r.card) || r.from.join(' ').toLowerCase().includes(f));
    shown = rows.length;
    body = rows.map(r => `<tr>${cell(r.card)}
      <td class="src">${r.from.map(t => esc(shortDeck(t))).join('<br>')}</td></tr>`).join('');
  }

  app.innerHTML = `
    <button class="back" onclick="go('deck','${d.id}')">← ${esc(d.title)}</button>
    <h2 class="title">${esc(d.group)} — everything</h2>
    <div class="srcline">${esc(d.course)} · ${decks.length} deck${decks.length === 1 ? '' : 's'}</div>
    <div class="bar">
      <div class="seg">
        <button class="${s.bydeck ? '' : 'on'}" onclick="chapterOrder(false)">A–Z</button>
        <button class="${s.bydeck ? 'on' : ''}" onclick="chapterOrder(true)">By deck</button>
      </div>
      <button class="iconbtn" onclick="session.hide=!session.hide;render()">
        ${s.hide ? '👁 Show definitions' : '🙈 Hide definitions'}</button>
      <span>${shown} of ${total}</span>
    </div>
    <input class="search" id="cfilter" placeholder="Filter…" value="${esc(s.filter)}">
    <table class="browse chapter ${s.bydeck ? 'grouped' : ''}"><tbody>${body}</tbody></table>
    ${!shown ? '<p style="color:var(--dim)">Nothing matches that filter.</p>' : ''}`;

  const cf = document.getElementById('cfilter');
  cf.oninput = e => { const p = e.target.selectionStart; s.filter = e.target.value; runChapter(d);
    const n = document.getElementById('cfilter'); n.focus(); n.setSelectionRange(p, p); };
  keyHandler = null;
}

function runBrowse(d){
  if (!session) session = { hide: false, filter: '' };
  const s = session;
  const f = s.filter.toLowerCase();

  /* A sequence deck reads as a numbered procedure, not a two-column glossary. */
  if (d.steps.length){
    const steps = d.steps.filter(st =>
      !f || (st.text + ' ' + (st.detail || '')).toLowerCase().includes(f));
    app.innerHTML = `
      <button class="back" onclick="go('deck','${d.id}')">← ${esc(d.title)}</button>
      <div class="bar"><span>${steps.length} of ${d.steps.length} steps</span></div>
      <input class="search" id="bfilter" placeholder="Filter…" value="${esc(s.filter)}">
      <ol class="placed">
        ${steps.map(st => `<li>
          <div class="row"><b>${d.steps.indexOf(st) + 1}</b><span>${esc(st.text)}</span></div>
          ${st.detail ? `<div class="detail">${esc(st.detail)}</div>` : ''}</li>`).join('')}
      </ol>
      ${!steps.length ? '<p style="color:var(--dim)">Nothing matches that filter.</p>' : ''}`;
    const sf = document.getElementById('bfilter');
    sf.oninput = e => { const p = e.target.selectionStart; s.filter = e.target.value; runBrowse(d);
      const nn = document.getElementById('bfilter'); nn.focus(); nn.setSelectionRange(p, p); };
    keyHandler = null;
    return;
  }

  /* Alphabetical by term. Leading punctuation is ignored so suffix and prefix
     entries file under their first letter — "-algia" under A, not bunched with
     every other hyphen. (Sequence decks keep procedure order; see above.) */
  const alpha = t => t.toLowerCase().replace(/^[^a-z0-9]+/, '');
  const rows = d.cards
    .filter(c => !f || (c.term + ' ' + c.def).toLowerCase().includes(f))
    .sort((a, b) => alpha(a.term).localeCompare(alpha(b.term)));

  app.innerHTML = `
    <button class="back" onclick="go('deck','${d.id}')">← ${esc(d.title)}</button>
    <div class="bar">
      <button class="iconbtn" onclick="session.hide=!session.hide;render()">
        ${s.hide ? '👁 Show definitions' : '🙈 Hide definitions'}</button>
      <span>${rows.length} of ${d.cards.length}</span>
    </div>
    <input class="search" id="bfilter" placeholder="Filter…" value="${esc(s.filter)}">
    <table class="browse"><tbody>
      ${rows.map((c, i) => `<tr>
        <td class="t">${esc(c.term)}</td>
        <td class="${s.hide ? 'hidden-def' : ''}" onclick="this.classList.remove('hidden-def')">
          ${defHtml(c.def)}${c.note && !s.hide ? `<span class="note">${esc(c.note)}</span>` : ''}</td></tr>`).join('')}
    </tbody></table>
    ${!rows.length ? '<p style="color:var(--dim)">Nothing matches that filter.</p>' : ''}`;

  const bf = document.getElementById('bfilter');
  bf.oninput = e => { const p = e.target.selectionStart; s.filter = e.target.value; runBrowse(d);
    const n = document.getElementById('bfilter'); n.focus(); n.setSelectionRange(p, p); };
  keyHandler = null;
}

/* ═══════════════ SHARED PIECES ═══════════════ */
function sessionBar(d, done, total, label){
  return `<button class="back" onclick="go('deck','${d.id}')">← ${esc(d.title)}</button>
    <div class="bar"><span>${label}</span>
      <div class="prog"><i style="width:${total ? Math.max(0, Math.min(100, done / total * 100)) : 0}%"></i></div>
      <span>${Math.max(0, done)}/${total}</span></div>`;
}
function results(d, big, lbl, missed, mode){
  app.innerHTML = `
    <button class="back" onclick="go('deck','${d.id}')">← ${esc(d.title)}</button>
    <div class="score">
      <div class="big">${esc(big)}</div>
      <div class="lbl">${esc(lbl)}</div>
      <div class="row">
        <button onclick="go('run','${d.id}','${mode}')">Run it again</button>
        <button onclick="go('deck','${d.id}')">Other modes</button>
        <button onclick="go('home')">All decks</button>
      </div>
      ${missed.length ? `<div class="missed"><h4>Worth another look</h4>
        ${missed.map(m => `<div>${m.q}<br><b>${esc(m.a)}</b></div>`).join('')}</div>` : ''}
    </div>`;
  keyHandler = null;
}

/* ═══════════════ ROUTER ═══════════════ */
function render(){
  keyHandler = null;
  if (view.screen === 'home') return screenHome();
  const d = deckById(view.deck);
  if (!d) return go('home');
  if (view.screen === 'deck') return screenDeck();
  ({ recall: runRecall, learn: runLearn, quiz: runQuiz, match: runMatch, tf: runTF,
     chest: runChest, order: runOrder, beat: runBeat, browse: runBrowse,
     chapter: runChapter, trace: runTrace, parts: runParts,
     figure: runFigure }[view.mode] || screenDeck)(d);
}
document.addEventListener('keydown', e => {
  if (e.key === 'Escape'){ return view.screen === 'run' ? go('deck', view.deck) : go('home'); }
  if (e.target.tagName === 'INPUT') return;   /* typing shouldn't fire shortcuts */
  if (keyHandler) keyHandler(e);
});
render();
</script>
</body>
