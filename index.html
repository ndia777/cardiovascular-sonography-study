<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cardiovascular Sonography — Study</title>
<style>
  :root{
    --bg:#0f1419; --bg2:#161d26; --card:#1b232e; --card2:#212b38;
    --line:#2b3745; --text:#e6edf3; --dim:#8b9bad; --accent:#4db8d4;
    --accent-dim:#2a6a7d; --good:#4ec98a; --bad:#e2685f; --warn:#e0b055;
    --radius:12px;
  }
  html[data-theme="light"]{
    --bg:#f4f6f8; --bg2:#ffffff; --card:#ffffff; --card2:#eef2f6;
    --line:#d8e0e8; --text:#16212c; --dim:#5d7186; --accent:#0f7c99;
    --accent-dim:#a9d9e6; --good:#127a4c; --bad:#b8352b; --warn:#8a6210;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-text-size-adjust:100%;
  }
  .wrap{max-width:900px;margin:0 auto;padding:20px 18px 80px}
  a{color:var(--accent)}
  button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}

  /* ---- header ---- */
  header.top{display:flex;align-items:center;gap:12px;margin-bottom:22px;flex-wrap:wrap}
  header.top h1{font-size:19px;margin:0;font-weight:650;letter-spacing:-.01em}
  header.top .sub{color:var(--dim);font-size:13px;margin-top:2px}
  .spacer{flex:1}
  .iconbtn{border:1px solid var(--line);background:var(--card);padding:7px 12px;
    border-radius:8px;font-size:13px;color:var(--dim)}
  .iconbtn:hover{color:var(--text);border-color:var(--accent-dim)}

  /* ---- home ---- */
  .search{width:100%;padding:11px 14px;border-radius:10px;border:1px solid var(--line);
    background:var(--card);color:var(--text);font-size:15px;margin-bottom:24px}
  .search:focus{outline:none;border-color:var(--accent)}
  /* The course line carries its own name on the left and its finished chapters
     on the right. Wraps to a second line on a narrow screen rather than
     squeezing either half. */
  .coursehead{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);
    margin:26px 0 10px;font-weight:600;
    display:flex;align-items:center;flex-wrap:wrap;gap:8px 14px}
  .pastbar{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-left:auto}
  .pastlabel{font-size:10.5px;letter-spacing:.08em;color:var(--dim);opacity:.75}
  /* Chips are deliberately quiet — sentence case, no weight, no fill. They are
     signposts to material already covered, and must never pull the eye away
     from the decks below them. */
  .chip{font-family:inherit;font-size:11.5px;letter-spacing:0;text-transform:none;
    font-weight:500;color:var(--dim);background:transparent;
    border:1px solid var(--line);border-radius:20px;padding:3px 11px;cursor:pointer;
    transition:color .15s ease,border-color .15s ease}
  .chip:hover{color:var(--text);border-color:color-mix(in srgb,var(--text) 30%,var(--line))}
  .chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  /* An open chip has to look pressed, or the panel that appeared below has no
     visible cause. */
  .chip[aria-expanded="true"]{color:var(--accent);
    border-color:color-mix(in srgb,var(--accent) 55%,var(--line));
    background:color-mix(in srgb,var(--accent) 12%,transparent)}
  @media (prefers-reduced-motion: reduce){ .chip{transition:none} }
  /* Heading above a chapter's grid — used by the current chapter and by an
     opened chip alike, so an opened chapter looks exactly like a present one. */
  .sect{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;
    color:var(--text);margin:22px 0 10px}
  .sect .now{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:500;
    padding:2px 7px;border-radius:20px;color:var(--accent);
    border:1px solid color-mix(in srgb,var(--accent) 45%,var(--line))}
  /* Sits beside the chapter it clears, so what it applies to is never in doubt,
     and stays borderless until hovered so it recedes next to the decks. */
  .sect .reset{font-family:inherit;font-size:11px;font-weight:500;color:var(--dim);
    background:transparent;border:1px solid transparent;border-radius:20px;
    padding:2px 9px;cursor:pointer;
    transition:color .15s ease,border-color .15s ease,background .15s ease}
  .sect .reset:hover{color:var(--text);border-color:var(--line)}
  .sect .reset:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  /* Armed. Red only at this point — the resting control is not a warning. */
  .sect .reset[data-armed="1"]{color:var(--bad);
    border-color:color-mix(in srgb,var(--bad) 55%,var(--line));
    background:color-mix(in srgb,var(--bad) 12%,transparent)}
  @media (prefers-reduced-motion: reduce){ .sect .reset{transition:none} }
  .pastwrap[hidden]{display:none}
  .decks{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
  /* Two grids can now sit directly on top of each other — the study guides and
     then the single-deck chapters — with no heading or fold between them to
     provide spacing. Slightly more than the 12px inside a grid, so the break
     reads as a break rather than as one continuous run of cards. */
  .decks + .decks{margin-top:20px}
  .deck{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:15px 16px;text-align:left;transition:.13s;display:block;width:100%}
  .deck:hover{border-color:var(--accent);transform:translateY(-2px)}
  /* Decks built from a study guide — the material actually being tested — carry
     a thin coloured edge so they stand out in the grid. Warn rather than accent,
     because accent is already the hover colour and the two would cancel out.
     Hover still brightens the same edge, so the signal survives the interaction
     instead of being replaced by it. */
  .deck.exam{border-color:color-mix(in srgb,var(--warn) 60%,var(--line))}
  .deck.exam:hover{border-color:var(--warn)}
  .badge.exam{border-color:color-mix(in srgb,var(--warn) 55%,var(--line));color:var(--warn)}
  /* A retired guide keeps the tag — it is still the instructor's study guide and
     not a deck of notes — but at half strength, so the guide for the chapter
     being studied now is the one that catches the eye. */
  .badge.exam.past{border-color:color-mix(in srgb,var(--warn) 26%,var(--line));
    color:color-mix(in srgb,var(--warn) 62%,var(--dim))}
  /* marks the chapter being worked on now, where the deck sits outside a
     section and so has no heading to carry the label */
  .badge.now{border-color:color-mix(in srgb,var(--accent) 50%,var(--line));color:var(--accent)}
  .deck h3{margin:0 0 6px;font-size:15.5px;font-weight:600;line-height:1.35}
  .deck .meta{font-size:12.5px;color:var(--dim)}
  .badges{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
  .badge{font-size:11px;padding:2px 8px;border-radius:20px;background:var(--card2);
    color:var(--dim);border:1px solid var(--line)}
  .badge.on{color:var(--good);border-color:color-mix(in srgb,var(--good) 40%,transparent)}
  /* A score badge takes its hue from --sh, set per badge; everything else is
     fixed here so the whole scale shares one weight and one saturation and
     reads as a family. Chroma is kept low deliberately — this has to sit beside
     the amber "Study guide" badge without either shouting.

     If a browser has no oklch these three declarations are simply dropped and
     the badge falls back to the plain one above, which is legible and correct,
     only uncoloured. */
  :root{ --s-l:.76; --s-c:.115; --s-border-l:.52; --s-bg-l:.26 }
  html[data-theme="light"]{ --s-l:.46; --s-c:.115; --s-border-l:.70; --s-bg-l:.955 }
  .badge.scored{
    color:oklch(var(--s-l) var(--s-c) var(--sh));
    border-color:oklch(var(--s-border-l) calc(var(--s-c) * .8) var(--sh));
    background:oklch(var(--s-bg-l) calc(var(--s-c) * .45) var(--sh))}

  /* ---- deck menu ---- */
  .back{color:var(--dim);font-size:14px;margin-bottom:14px;display:inline-block}
  .back:hover{color:var(--accent)}
  h2.title{font-size:23px;margin:0 0 4px;letter-spacing:-.01em}
  .srcline{color:var(--dim);font-size:12.5px;margin-bottom:22px;word-break:break-word}
  .modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
  .mode{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px;text-align:left;transition:.13s}
  .mode:hover{border-color:var(--accent);background:var(--card2)}
  .mode strong{display:block;font-size:15px;margin-bottom:4px}
  .mode span{font-size:12.5px;color:var(--dim);line-height:1.45}

  /* ---- shared session chrome ---- */
  .bar{display:flex;align-items:center;gap:12px;margin-bottom:18px;font-size:13px;color:var(--dim)}
  .prog{flex:1;height:5px;background:var(--card2);border-radius:3px;overflow:hidden}
  .prog i{display:block;height:100%;background:var(--accent);transition:width .3s}

  /* ---- flashcards ---- */
  .fc{background:var(--card);border:1px solid var(--line);border-radius:16px;
    min-height:290px;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:36px 28px;text-align:center;cursor:pointer;user-select:none}
  .fc:hover{border-color:var(--accent-dim)}
  .fc .side{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-bottom:16px}
  .fc .term{font-size:29px;font-weight:600;line-height:1.25;letter-spacing:-.015em}
  .fc .def{font-size:19px;line-height:1.5;max-width:560px}
  .fc .tap{margin-top:22px;font-size:12.5px;color:var(--dim)}
  .grade{display:flex;gap:12px;margin-top:16px}
  .grade button{flex:1;padding:14px;border-radius:10px;border:1px solid var(--line);
    background:var(--card);font-size:15px;font-weight:550}
  .grade .again:hover{border-color:var(--bad);color:var(--bad)}
  .grade .ok:hover{border-color:var(--good);color:var(--good)}

  /* ---- quiz ---- */
  .q{font-size:19px;line-height:1.45;margin-bottom:20px;font-weight:500}
  .q b{color:var(--accent);font-weight:650}
  .q em{font-style:normal;color:var(--text)}
  .choices{display:flex;flex-direction:column;gap:9px}
  .choice{border:1px solid var(--line);background:var(--card);border-radius:10px;
    padding:13px 15px;text-align:left;display:flex;gap:12px;align-items:flex-start;
    line-height:1.45;font-size:15px;transition:.1s}
  .choice:hover:not(:disabled){border-color:var(--accent)}
  /* two big targets rather than a list of four — the whole point of the mode is
     that the decision is binary and quick */
  .tfrow{gap:12px;margin-top:18px}
  .tf{flex:1;padding:16px;border:1px solid var(--line);border-radius:var(--radius);
    background:var(--card);font-size:16px;font-weight:600;transition:.13s}
  .tf:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
  .tf.correct{border-color:var(--good);color:var(--good);background:color-mix(in srgb,var(--good) 12%,var(--card))}
  .tf.wrong{border-color:var(--bad);color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--card))}
  .tf:disabled{cursor:default}
  .choice .k{flex:0 0 22px;height:22px;border-radius:5px;background:var(--card2);
    color:var(--dim);font-size:12px;display:flex;align-items:center;justify-content:center;margin-top:1px}
  .choice.correct{border-color:var(--good);background:color-mix(in srgb,var(--good) 12%,var(--card))}
  .choice.correct .k{background:var(--good);color:#04120b}
  .choice.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--card))}
  .choice.wrong .k{background:var(--bad);color:#180504}
  .choice:disabled{cursor:default}
  .why{margin-top:16px;padding:13px 15px;border-radius:10px;background:var(--card2);
    border-left:3px solid var(--accent);font-size:14px;line-height:1.55;color:var(--text)}
  .why b{color:var(--accent)}
  .next{margin-top:18px;width:100%;padding:14px;border-radius:10px;background:var(--accent);
    color:#04161c;font-weight:650;font-size:15px}
  html[data-theme="light"] .next{color:#fff}

  /* ---- match ---- */
  .matchgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:start}
  .mcol{display:flex;flex-direction:column;gap:9px}
  .mitem{border:1px solid var(--line);background:var(--card);border-radius:10px;
    padding:12px 13px;text-align:left;font-size:14px;line-height:1.4;transition:.12s}
  .mitem:hover:not(:disabled){border-color:var(--accent)}
  .mitem.sel{border-color:var(--accent);background:var(--card2)}
  .mitem.done{opacity:.32;border-style:dashed;cursor:default}
  .mitem.bad{border-color:var(--bad);animation:shake .3s}
  @keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

  /* ---- chest game ---- */
  .torso{position:relative;max-width:460px;margin:0 auto;aspect-ratio:200/240}
  .torso svg{width:100%;height:100%;display:block}
  /* Labelled anatomical figures. Same dot mechanics as the electrode torso, so
     the two modes behave identically under the hand. */
  /* The aspect ratio is set per figure from its own viewBox, never hardcoded.
     The dots are positioned in percentages of THIS box, so if the box and the
     artwork disagree the SVG letterboxes inside it and every label slides off
     by the size of the gap. */
  .figure{position:relative;max-width:520px;margin:14px auto 0}
  .figure svg{width:100%;height:100%;display:block}
  /* Leaders live in their own overlay stretched across the figure box, so their
     coordinates are the very same percentages the dots use and the two cannot
     drift apart. non-scaling-stroke keeps the hairline one pixel wide, which the
     non-uniform preserveAspectRatio would otherwise stretch into a wedge. */
  .figure .leaders{position:absolute;inset:0;pointer-events:none}
  /* Wide enough to read against a busy illustration — at 1px and half opacity
     the leaders simply vanished into the artwork. */
  .figure .leaders line{stroke:var(--accent);stroke-width:2;opacity:.9;
    vector-effect:non-scaling-stroke}
  .figure .leaders line.on{opacity:1;stroke-width:3}
  .figure .leaders line.off{opacity:.25}
  .figsvg .chamber{stroke:none}
  /* Vessels are outlined because several of them pass over a chamber of the same
     colour — the aorta across the left atrium, the trunk across the right. Fill
     alone left them reading as one continuous red or blue mass. */
  .figsvg .vessel{stroke:var(--line);stroke-width:1.5;stroke-linejoin:round}
  /* Deoxygenated blue, oxygenated red — the convention every textbook uses, and
     the quickest way to read which side of the heart you are looking at. Mixed
     toward the card colour so neither shouts in dark mode. */
  .figsvg .deoxyc{fill:color-mix(in srgb,#4b7fd4 46%,var(--card))}
  .figsvg .deoxyv{fill:color-mix(in srgb,#4b7fd4 32%,var(--card))}
  .figsvg .oxyc  {fill:color-mix(in srgb,#d4564b 44%,var(--card))}
  .figsvg .oxyv  {fill:color-mix(in srgb,#d4564b 30%,var(--card))}
  .figsvg .outline{fill:none;stroke:var(--line);stroke-width:2.5}
  .figsvg .wall{fill:none;stroke:var(--line);stroke-width:2}
  .figsvg .valves path{fill:none;stroke:var(--text);stroke-width:3;stroke-linecap:round;opacity:.75}
  .figsvg .figflow path{fill:none;stroke:var(--dim);stroke-width:1.6;opacity:.85}
  .figcap{color:var(--dim);font-size:12.5px;text-align:center;margin-top:16px;line-height:1.6}
  /* The attribution the licence asks for. Quiet, but present on every screen
     the diagram appears on — not tucked away in a file nobody opens. */
  .figcredit{color:var(--dim);font-size:11.5px;text-align:center;margin-top:6px;
    opacity:.8;line-height:1.6}
  .figcredit a{color:var(--dim);text-decoration:underline}
  .figcredit a:hover{color:var(--accent)}
  /* Sized as a share of the figure, not fixed px, so the spacing between
     electrodes stays proportional and dots never collide on a narrow screen. */
  .dot{position:absolute;width:5.2%;aspect-ratio:1;transform:translate(-50%,-50%);
    border-radius:50%;border:2px solid var(--accent);
    background:color-mix(in srgb,var(--accent) 30%,var(--bg));
    display:flex;align-items:center;justify-content:center;
    font-size:clamp(7px,1.55vw,10.5px);font-weight:700;color:var(--text);transition:.12s}
  .dot:hover:not(:disabled){transform:translate(-50%,-50%) scale(1.2)}
  .dot.correct{border-color:var(--good);background:var(--good);color:#04120b}
  .dot.wrong{border-color:var(--bad);background:var(--bad);color:#fff}
  .dot.muted{opacity:.4}
  /* On the anatomical figures the ring is drawn smaller than the button. A dot
     wide enough to tap comfortably is also wide enough to cover the valve it is
     pointing at and to swallow its own leader line, which made the four valves
     ambiguous. So the hit area stays 5.2% — thumbs need that, and it is what
     keeps neighbouring hotspots from overlapping — and only the visible ring
     shrinks, to about 3.2% of the figure. The faint halo keeps it legible
     against artwork that is busy and light in places and dark in others. */
  .figure .dot{border:none;background:none}
  .figure .dot::before{content:'';position:absolute;inset:19%;border-radius:50%;
    border:2px solid var(--accent);
    background:color-mix(in srgb,var(--accent) 34%,var(--bg));
    box-shadow:0 0 0 1.5px color-mix(in srgb,var(--bg) 62%,transparent)}
  .figure .dot.correct::before{border-color:var(--good);background:var(--good)}
  .figure .dot.wrong::before{border-color:var(--bad);background:var(--bad)}

  /* ---- watch a heartbeat ---- */
  .rhythms{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
  .rbtn{border:1px solid var(--line);background:var(--card);border-radius:20px;
    padding:6px 12px;font-size:12.5px;color:var(--dim);transition:.12s}
  .rbtn:hover{border-color:var(--accent);color:var(--text)}
  .rbtn.on{background:var(--accent);border-color:var(--accent);color:#04161c;font-weight:650}
  html[data-theme="light"] .rbtn.on{color:#fff}
  .rbtn.danger{border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
  .rbtn.danger.on{background:var(--bad);border-color:var(--bad);color:#fff}

  .beatwrap{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:18px;align-items:center}
  @media(max-width:620px){ .beatwrap{grid-template-columns:1fr} }
  .heart{position:relative;width:100%;aspect-ratio:1}
  .heartsvg{width:100%;height:100%;display:block}
  /* The whole body shortens as the ventricles eject, and each cavity shrinks
     MORE than the body does — the difference between the two is what reads as
     the muscular wall thickening. */
  .heartbody{transform-box:view-box;transform-origin:150px 165px;
    transition:transform .45s cubic-bezier(.34,0,.28,1)}
  /* The impulse dot is an HTML element sitting over the SVG, so it has to be
     carried by the same squeeze or it drifts off the apex mid-contraction. Its
     layer matches .heartbody exactly: 150/300 = 50%, 165/300 = 55%. */
  .heart.x-ventricles .heartbody,.heart.x-ventricles .track{transform:scale(.945,.90)}
  .heart.x-ventricles-relax .heartbody,.heart.x-ventricles-relax .track{transform:scale(1.015,1.025)}
  .track{position:absolute;inset:0;transform-origin:50% 55%;
    transition:transform .45s cubic-bezier(.34,0,.28,1)}

  /* Each cavity is anchored at the septum on the valve plane (atria) or at the
     apex (ventricles) rather than at its own centre. Scaling about the centre
     pulls both halves away from the midline and tears a gap down the septum,
     which is what forced the old squeeze to stay shallow. Anchored this way the
     free wall draws inward and the base descends toward a fixed apex — the way
     a ventricle actually contracts — so it can squeeze far harder and still
     hold together. */
  .heartsvg .myo{fill:color-mix(in srgb,var(--bad) 20%,var(--card));stroke:none;
    transition:fill .3s ease}
  .heart.x-atria .myo,.heart.x-ventricles .myo{fill:color-mix(in srgb,var(--bad) 32%,var(--card))}
  .heartsvg .ch{fill:var(--card2);stroke:none;transform-box:fill-box;
    transition:fill .3s ease, transform .45s cubic-bezier(.34,0,.28,1)}
  .atria-l,.vent-l{transform-origin:100% 100%}
  .atria-r,.vent-r{transform-origin:0% 100%}
  .heart.x-atria .atria-l,.heart.x-atria .atria-r{
    fill:color-mix(in srgb,var(--accent) 46%,var(--card2));transform:scale(.80,.78)}
  .heart.x-ventricles .vent-l,.heart.x-ventricles .vent-r{
    fill:color-mix(in srgb,var(--accent) 52%,var(--card2));transform:scale(.80,.82)}
  /* Relaxing: the ventricles spring back and fill, just past resting size. The
     overshoot is capped — anchored at the apex, any more and the filling cavity
     rises through the valve plane or spills past the outline. */
  .heart.x-ventricles-relax .vent-l,.heart.x-ventricles-relax .vent-r{
    fill:color-mix(in srgb,var(--good) 28%,var(--card2));transform:scale(1.04,1.02)}
  @media (prefers-reduced-motion: reduce){
    .heartsvg .ch,.heartbody{transition:fill .3s ease}
    .heart.x-atria .atria-l,.heart.x-atria .atria-r,
    .heart.x-ventricles .vent-l,.heart.x-ventricles .vent-r,
    .heart.x-ventricles-relax .vent-l,.heart.x-ventricles-relax .vent-r,
    .heart.x-ventricles .heartbody,.heart.x-ventricles-relax .heartbody,
    .heart.x-ventricles .track,.heart.x-ventricles-relax .track{transform:none}
  }
  .heartsvg .seg{stroke:var(--line);stroke-width:3;transition:stroke .15s}
  .heartsvg .node{fill:var(--card);stroke:var(--line);stroke-width:2.5;transition:.15s}
  /* the segment carrying the impulse right now */
  .heart[data-lit~="internodal"] .internodal,
  .heart[data-lit~="his"] .his,
  .heart[data-lit~="branches"] .branches,
  /* the faint fibres are always there as anatomy; the live copies draw over
     them from the apex outward as the wavefront spreads */
  .purkinje-live{fill:none;stroke:var(--accent);stroke-width:4;stroke-linecap:round;
    stroke-dasharray:100;transition:stroke-dashoffset .12s linear}
  .heart[data-lit~="sa"] .node.sa,
  .heart[data-lit~="av"] .node.av{fill:var(--accent);stroke:var(--accent)}
  .heart.holding .node.av{animation:avhold .7s ease-in-out infinite}
  @keyframes avhold{50%{r:10;opacity:.55}}
  /* fibrillation: the chamber quivers instead of contracting */
  .heart.h-atrial-quiver .atria-l,.heart.h-atrial-quiver .atria-r{animation:quiver .18s linear infinite}
  .heart.h-vent-quiver .vent-l,.heart.h-vent-quiver .vent-r{animation:quiver .12s linear infinite;
    fill:color-mix(in srgb,var(--bad) 34%,var(--card2))}
  @keyframes quiver{0%,100%{opacity:1}50%{opacity:.45}}
  .heart.h-ectopic-vent .vent-l{fill:color-mix(in srgb,var(--warn) 30%,var(--card2))}
  .heart.h-ectopic-atrial .atria-r{fill:color-mix(in srgb,var(--warn) 30%,var(--card2))}
  .impulse{position:absolute;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;
    background:var(--accent);box-shadow:0 0 12px 4px color-mix(in srgb,var(--accent) 55%,transparent)}
  .impulse.held{animation:avhold .7s ease-in-out infinite}

  .ecg{width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px}
  /* the same trace the animation draws, shown beside a rhythm's definition */
  .cardtrace{margin:14px 0 2px;display:block}
  /* the highlighted span, and the bracket under it that pins down its edges */
  .partsvg{margin:16px 0 4px;display:block}
  .parthi{fill:color-mix(in srgb,var(--accent) 22%,transparent);
    stroke:color-mix(in srgb,var(--accent) 55%,transparent);stroke-width:1;rx:3}
  .partbar{fill:none;stroke:var(--accent);stroke-width:1.6}
  .ecgbase{stroke:var(--line);stroke-width:1;stroke-dasharray:3 5}
  .ecgtrace{fill:none;stroke:var(--good);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
  .ecgtrace.danger{stroke:var(--bad)}
  .ecgnow{stroke:var(--accent);stroke-width:1.4;opacity:.7}
  .phasehead{font-size:16px;font-weight:650;margin:16px 0 6px}
  .phasehead .pause{color:var(--warn);font-weight:500;font-size:14px}
  .phasesay{margin:0 0 4px;font-size:14.5px;line-height:1.6;color:var(--dim)}
  .phasesay .eg{color:var(--accent);font-weight:600}
  .phasehead .stepno{font-size:12px;font-weight:500;color:var(--dim);margin-left:8px}
  /* drains while the step holds, so the wait reads as deliberate rather than stuck */
  .dwell{height:3px;background:var(--card2);border-radius:2px;overflow:hidden;margin:10px 0 2px}
  .dwell i{display:block;height:100%;background:var(--accent);opacity:.55;transition:width .1s linear}

  /* ---- put in order ---- */
  .stagehead{display:flex;align-items:baseline;gap:9px;margin:0 0 14px;font-size:13px;
    font-weight:600;letter-spacing:.02em;color:var(--accent)}
  .stagehead span{font-weight:400;color:var(--dim);letter-spacing:0}
  .placed{list-style:none;padding:0;margin:0 0 20px}
  .placed li{border:1px solid var(--line);border-radius:9px;background:var(--card);
    margin-bottom:7px;font-size:14px;line-height:1.45;overflow:hidden}
  /* the step whose rationale is showing gets an accent edge to draw the eye */
  .placed li.current{border-color:color-mix(in srgb,var(--accent) 48%,var(--line))}
  .placed .row{display:flex;gap:11px;align-items:flex-start;padding:10px 13px}
  .placed .row b{color:var(--good);flex:0 0 20px;font-variant-numeric:tabular-nums}
  /* tinted panel flush to the bottom of the card — clearly not a clickable option */
  .placed .detail{padding:10px 13px;font-size:12.9px;line-height:1.55;color:var(--text);
    background:color-mix(in srgb,var(--accent) 12%,transparent);
    border-top:1px solid color-mix(in srgb,var(--accent) 30%,transparent)}
  /* The source table calls this column "Detailed Instruction / Rationales" — it
     carries both, so the label stays neutral rather than claiming why or how. */
  .placed .detail::before{content:"Detail: ";color:var(--accent);font-weight:700}
  .steps{display:flex;flex-direction:column;gap:8px}
  .step{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:12px 14px;
    text-align:left;font-size:14.5px;line-height:1.45;transition:.12s;width:100%}
  .step:hover{border-color:var(--accent);background:var(--card2)}
  .step.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--card));animation:shake .3s}

  /* ---- browse ---- */
  table.browse{width:100%;border-collapse:collapse;font-size:14.5px}
  table.browse td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
  table.browse td.t{font-weight:600;width:34%;color:var(--accent)}
  /* which deck a row came from — present but quiet, so it explains an overlap
     without competing with the term or the definition */
  table.browse.chapter td.t{width:26%}
  table.browse.chapter.grouped td.t{width:32%}
  /* a deck heading inside the chapter table — reads as a divider, not a row */
  table.browse tr.secthead td{background:var(--card2);font-weight:650;font-size:12px;
    letter-spacing:.06em;text-transform:uppercase;color:var(--accent);
    padding:9px 12px;border-top:1px solid var(--line)}
  table.browse tr.secthead:first-child td{border-top:0}
  table.browse tr.secthead span{float:right;font-weight:500;letter-spacing:0;
    text-transform:none;color:var(--dim)}
  /* two-way switch for the ordering */
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .seg button{padding:6px 12px;font-size:12.5px;color:var(--dim);background:var(--card)}
  .seg button:hover{color:var(--text)}
  .seg button.on{background:var(--accent);color:#04161c;font-weight:650}
  html[data-theme="light"] .seg button.on{color:#fff}
  table.browse td.src{width:18%;font-size:11.5px;color:var(--dim);line-height:1.45;
    text-align:right;vertical-align:top}
  @media(max-width:560px){ table.browse td.src{display:none} }
  table.browse tr:hover td{background:var(--card)}
  .hidden-def{color:transparent;background:var(--card2);border-radius:4px;cursor:pointer}
  .hidden-def:hover{color:var(--dim)}
  .eg{color:var(--accent);font-weight:650}
  /* names the category Recall is asking for, where the term declares one */
  .asks{color:var(--accent);font-weight:650}
  .note{display:block;margin-top:6px;font-size:12.5px;color:var(--warn);line-height:1.5}
  .note::before{content:"⚑ ";}

  /* ---- results ---- */
  .score{text-align:center;padding:34px 20px}
  .score .big{font-size:54px;font-weight:700;letter-spacing:-.03em;line-height:1}
  .score .lbl{color:var(--dim);margin-top:8px;font-size:14px}
  .row{display:flex;gap:10px;margin-top:24px}
  .row button{flex:1;padding:13px;border-radius:10px;border:1px solid var(--line);
    background:var(--card);font-weight:550;font-size:14.5px}
  .row button:hover{border-color:var(--accent)}
  .missed{margin-top:26px;text-align:left}
  .missed h4{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin:0 0 10px}
  .missed div{padding:11px 13px;border-radius:9px;background:var(--card);border:1px solid var(--line);
    margin-bottom:8px;font-size:14px;line-height:1.5}
  .missed div b{color:var(--good);font-weight:600}

  @media(max-width:560px){
    .wrap{padding:16px 13px 70px}
    .fc .term{font-size:24px} .fc .def{font-size:17px}
    .matchgrid{gap:8px} .mitem{font-size:13px;padding:10px}
    .q{font-size:17px}
  }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script src="decks.js"></script>
<script>
/* ═══════════════════════════════════════════════════════════════════════════
   Cardiovascular Sonography study app.
   Content lives in decks.js — this file is only the engine.
   ═════════════════════════════════════════════════════════════════════════ */

const app = document.getElementById('app');
const DECKS = window.DECKS || [];
const STORE = 'cvs-study-v1';

/* A deck is either a vocabulary list (`cards`) or a sequence (`steps`).
   Default both so the rest of the engine never has to check. */
DECKS.forEach(d => { d.cards = d.cards || []; d.steps = d.steps || []; });

/* Not every card is a term with a definition. Some are a topic paired with a
   fact, list, or sequence ("Parts of ATP", "Order of chest placement"). Those
   are marked `fact: true`: fine to flip through or match, but useless in Recall,
   which shows the definition and asks you to type the term — you would have to
   type the question. Recall and reverse multiple choice skip them. */
const recallable = d => d.cards.filter(c => !c.fact);

/* ---------- storage ---------- */
const load = () => { try { return JSON.parse(localStorage.getItem(STORE)) || {}; } catch { return {}; } };
const save = o => { try { localStorage.setItem(STORE, JSON.stringify(o)); } catch {} };
function record(deckId, patch){
  const s = load();
  s[deckId] = Object.assign({}, s[deckId], patch, { last: Date.now() });
  save(s);
}

/* ---------- theme ---------- */
/* Dark by default — these get used at night. The toggle sticks once it's set. */
let theme = localStorage.getItem('cvs-theme') || 'dark';
document.documentElement.dataset.theme = theme;
function toggleTheme(){
  theme = theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = theme;
  localStorage.setItem('cvs-theme', theme);
  render();
}

/* ---------- helpers ---------- */
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const sample  = (a, n) => shuffle(a).slice(0, n);
/* Decks run oldest-first inside a course, so the list follows the order the
   material was actually covered rather than the order the file happens to be
   written in. Dates are ISO, so a plain string compare is a date compare.
   Decks added the same day keep their order in decks.js — sort is stable, so
   comparing dates alone preserves it. A deck with no date sorts last instead
   of throwing, and the test suite requires every deck to carry one. */
const byAdded = (a, b) => String(a.added || '9999-99-99').localeCompare(String(b.added || '9999-99-99'));
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* Definitions read as prose, so a trailing "Example: …" gets its own line and a
   label. Applied AFTER escaping, so the <br> is the only markup that survives.
   Used where a definition is read (recall, flashcards, review) — not in
   multiple-choice options or matching tiles, which stay compact. */
const defHtml = s => esc(s).replace(/\s*Example:\s*/g, '<br><span class="eg">Example:</span> ');
const deckById = id => DECKS.find(d => d.id === id);

let view = { screen:'home', deck:null, mode:null };
let session = null;              // live state for the active mode
let keyHandler = null;

function go(screen, deck, mode){
  view = { screen, deck, mode };
  session = null;
  window.scrollTo(0, 0);
  render();
}

/* ---------- score colour ----------

   A score badge is coloured by hue on the ordinary letter-grade scale: below 60
   red, then 60 / 70 / 80 / 90 as the D, C, B and A thresholds.

   The hue ramps CONTINUOUSLY between those anchors rather than each band having
   its own gradient. Per-band gradients look right until you reach an edge: if 79
   is the brightest amber and 80 the darkest green, then gaining a point makes
   the badge look worse. Here the colour only ever improves as the score rises,
   and the bands still read as distinct because the hue moves fastest as it
   crosses each threshold.

   Hue is the only thing that varies. Lightness and chroma are fixed per theme,
   in oklch, where equal lightness actually looks equal — in hsl the same
   lightness makes yellow glare and blue vanish, which is exactly the trap when
   a scale runs red to green through amber. The endpoints are tuned to the
   --bad and --good already in the palette, so these read as part of the theme
   rather than a second set of colours competing with it.

   Only percentages get this. The match time is in seconds and lower is better,
   so the same ramp would run backwards. */
const GRADE_ANCHORS = [[0, 25], [60, 48], [70, 78], [80, 112], [90, 150], [100, 156]];
function scoreHue(pct){
  const s = Math.max(0, Math.min(100, Number(pct) || 0));
  for (let i = 1; i < GRADE_ANCHORS.length; i++){
    const [s0, h0] = GRADE_ANCHORS[i - 1], [s1, h1] = GRADE_ANCHORS[i];
    if (s <= s1) return h0 + (h1 - h0) * ((s - s0) / (s1 - s0));
  }
  return GRADE_ANCHORS[GRADE_ANCHORS.length - 1][1];
}
/* The number stays on the badge, so the colour is a second reading of the same
   fact and never the only one — which is what makes a red/green scale safe. */
const scoreBadge = (label, pct) =>
  `<span class="badge scored" style="--sh:${scoreHue(pct).toFixed(1)}">${label} ${pct}%</span>`;

/* Clears every score in one chapter, in two clicks.

   Two clicks rather than a confirm dialog: a dialog is a heavier interruption
   than the action deserves, and it puts the destructive answer behind a button
   that says "OK", which is the least descriptive word available. Arming the
   control instead makes the second click say exactly what it does — and the
   armed state disarms itself after a few seconds, so a control left armed and
   forgotten cannot be triggered by a later, unrelated click.

   Only the decks that HAVE a score are listed in data-ids, so this never
   invents an entry for a deck that was never opened. */
let armedReset = null;
function disarmReset(){
  if (!armedReset) return;
  clearTimeout(armedReset.timer);
  if (armedReset.btn.isConnected){
    armedReset.btn.removeAttribute('data-armed');
    armedReset.btn.textContent = 'Reset scores';
  }
  armedReset = null;
}
function resetScores(btn){
  if (btn.dataset.armed !== '1'){
    disarmReset();
    btn.dataset.armed = '1';
    btn.textContent = 'Erase scores?';
    armedReset = { btn, timer: setTimeout(disarmReset, 5000) };
    return;
  }
  disarmReset();
  const s = load();
  (btn.dataset.ids || '').split(' ').filter(Boolean).forEach(id => { delete s[id]; });
  save(s);
  render();
}

/* Shows or hides one finished chapter. The chip and the panel are wired
   together by aria-controls/aria-expanded, so a screen reader announces the
   chip as the expandable thing it is; this is what <details> used to give for
   free, and it is the one thing worth keeping from it.

   The choice is remembered, so a chapter you keep going back to is not a click
   away every session. The boolean is stored rather than the key being deleted
   on close, so "I shut this deliberately" stays distinguishable from "never
   touched it" — otherwise a section that defaults open would spring back the
   moment the page reloaded. */
function togglePast(btn){
  const panel = document.getElementById(btn.getAttribute('aria-controls'));
  if (!panel) return;
  const open = btn.getAttribute('aria-expanded') !== 'true';
  btn.setAttribute('aria-expanded', String(open));
  panel.hidden = !open;
  const s = load(), o = Object.assign({}, s.__open);
  o[btn.dataset.key] = open;
  s.__open = o; save(s);
}

/* `exam` marks a deck as an official study guide — the instructor's, not notes
   worked up into one. `retired` says the chapter it belongs to is behind us.

   The two were one flag until the flag had to mean opposite things at once.
   `exam` was doing double duty: naming what a deck IS, and deciding that it
   gets pinned to the top in a yellow border. Putting a chapter away meant
   dropping the flag, which stripped the pinning as intended but also erased any
   trace that the deck had ever been a study guide — leaving a finished guide
   indistinguishable from a deck of notes.

   So `exam` now answers only "is this a study guide", which never stops being
   true, and `pinned` answers "does it lead its course", which stops the moment
   the chapter is retired. A retired guide keeps its badge, loses the border,
   and folds away with the chapter it came from. */
const pinned = d => !!d.exam && !d.retired;

/* ═══════════════ HOME ═══════════════ */
function screenHome(){
  const q = (session && session.q || '').toLowerCase();
  const progress = load();

  let list = DECKS;
  if (q) list = DECKS.filter(d =>
    (d.title + ' ' + d.course).toLowerCase().includes(q) ||
    d.cards.some(c => (c.term + ' ' + c.def).toLowerCase().includes(q)));

  /* Sections run alphabetically by SUBJECT, not by course code — "BIO101 ·
     Anatomy & Physiology" files under A — but a course being actively studied
     comes first as a tier.

     "Actively studied" means it holds a study guide OR a chapter marked
     current. Either alone is enough. Guides used to be the whole test, which
     broke the moment a chapter was retired: retiring a finished guide is how a
     chapter gets put away, so a course mid-chapter with its old guides retired
     scored zero and sank below courses nobody is taking this week. The chapter
     you are sitting in is the strongest signal there is that a course is live,
     and it now counts for at least as much as a guide.

     That rule, not a hardcoded exception, is what decides the order today.
     Pinning a course by name would go stale the moment its status changed, and
     would quietly stop making sense to anyone reading this later. Alphabetical
     still decides everything within a tier. */
  const subject = c => (c.split('·')[1] || c).trim();
  const isLive = c => list.some(d => d.course === c && (pinned(d) || d.current));
  const courses = [...new Set(list.map(d => d.course))]
    .sort((a, b) => (isLive(b) - isLive(a)) || subject(a).localeCompare(subject(b)));
  let html = `
    <header class="top">
      <div>
        <h1>Cardiovascular Sonography</h1>
        <div class="sub">${DECKS.length} decks · ${DECKS.reduce((n,d)=>n+d.cards.length,0)} terms · Term 1</div>
      </div>
      <div class="spacer"></div>
      <button class="iconbtn" onclick="toggleTheme()">${theme==='dark'?'☀ Light':'☾ Dark'}</button>
    </header>
    <input class="search" id="search" placeholder="Search decks or terms…" value="${esc(session&&session.q||'')}">`;

  if (!list.length) html += `<p style="color:var(--dim)">No decks match that search.</p>`;

  /* Study-guide decks lead each section — they are the tested material — and
     everything else folds away behind a disclosure so the page stays short as
     decks pile up. A course with no study guide of its own therefore collapses
     whole, down to its heading and a count; the decks are one click away and
     the section still reads as an index entry rather than a wall.

     While a search is running every fold is forced open, so a match can never
     hide inside a collapsed section. */
  const openState = load().__open || {};
  let panelSeq = 0;
  courses.forEach(c => {
    const inCourse = list.filter(d => d.course === c).sort(byAdded);
    const lead = inCourse.filter(pinned);
    const rest = inCourse.filter(d => !pinned(d));
    /* Whether anything in this course is spotlighted. A pinned guide and a
       current chapter both count as "something is already showing", which is
       what the folds below defer to when deciding whether to open. */
    const spotlit = rest.some(d => d.current);
    /* `bare` means the deck is rendered outside any section, so there is no
       heading above it to carry the "current" marker and the card must carry it
       itself. Inside a section the heading already says it, and repeating it on
       every card is just noise. */
    const deckCard = (d, bare) => {
      const p = progress[d.id] || {};
      const hits = q ? d.cards.filter(x => (x.term+' '+x.def).toLowerCase().includes(q)).length : 0;
      return `<button class="deck ${pinned(d) ? 'exam' : ''}" onclick="go('deck','${d.id}')">
        <h3>${esc(d.title)}</h3>
        <div class="meta">${d.cards.length ? `${d.cards.length} terms` : `${d.steps.length} steps`}${d.questions ? ` · ${d.questions.length} written questions` : ''}${hits ? ` · <span style="color:var(--accent)">${hits} match${hits>1?'es':''}</span>` : ''}</div>
        <div class="badges">
          ${d.exam ? `<span class="badge exam${d.retired ? ' past' : ''}">Study guide</span>` : ''}
          ${d.current && bare ? `<span class="badge now">Current</span>` : ''}
          ${p.recallBest != null ? scoreBadge('Recall', p.recallBest) : ''}
          ${p.quizBest != null ? scoreBadge('Quiz best', p.quizBest) : ''}
          ${p.tfBest != null ? scoreBadge('T/F', p.tfBest) : ''}
          ${p.traceBest != null ? scoreBadge('Rhythms', p.traceBest) : ''}
          ${p.partsBest != null ? scoreBadge('Segments', p.partsBest) : ''}
          ${p.figureBest != null ? scoreBadge('Diagram', p.figureBest) : ''}
          ${p.matchBest != null ? `<span class="badge on">Match ${p.matchBest}s</span>` : ''}
          ${p.learned ? `<span class="badge on">${p.learned} learned</span>` : ''}
          ${!p.last ? `<span class="badge">Not started</span>` : ''}
        </div></button>`;
    };

    /* Chapters split in two: the ones being studied now, which are simply on
       screen, and the ones already covered, which become chips on the course
       heading line.

       They used to be a stack of collapsed <details>, one row each. That row is
       charged whether or not you ever open it, so every finished chapter pushed
       the next course further down the page and the gap between subjects grew
       all term. Chips cost no rows at all — they ride on a line that is being
       drawn anyway — so a course takes the same vertical space with eight
       finished chapters as with none, and the page reads as what is current.
       Opening one drops its decks in below, laid out exactly as any other. */
    const inG = g => rest.filter(d => d.group === g);
    const isNow = g => inG(g).some(d => d.current);
    const byFirstAdded = (a, b) => (inG(a)[0].added || '').localeCompare(inG(b)[0].added || '');

    const groups = [...new Set(rest.map(d => d.group).filter(Boolean))].sort(byFirstAdded);
    const nowGroups = groups.filter(isNow);
    const pastGroups = groups.filter(g => !isNow(g));

    /* Ungrouped decks are nobody's chapter, so they get one chip of their own
       rather than being lost — unless one is current, in which case it belongs
       on screen with the rest of the current material. */
    const loose = rest.filter(d => !d.group);
    const looseNow = loose.filter(d => d.current);
    const loosePast = loose.filter(d => !d.current);

    /* With nothing pinned and nothing current there is nothing to defer to, so
       a course opens its chapters rather than presenting a row of chips and no
       decks at all. The moment anything is spotlighted, the rest gives way. */
    const openByDefault = !lead.length && !spotlit && !looseNow.length;

    const panels = [
      ...pastGroups.map(g => ({ key: `${c}/${g}`, label: g, decks: inG(g) })),
      ...(loosePast.length ? [{ key: `${c}/other`, label: `${loosePast.length} more deck${
        loosePast.length > 1 ? 's' : ''}`, decks: loosePast }] : []),
    ].map(p => Object.assign(p, {
      id: `past${panelSeq++}`,
      open: !!(q || (openState[p.key] === undefined ? openByDefault : openState[p.key])),
    }));

    const chips = panels.map(p =>
      `<button type="button" class="chip" data-key="${esc(p.key)}" aria-controls="${p.id}"
        aria-expanded="${p.open}" onclick="togglePast(this)">${esc(p.label)}</button>`).join('');

    html += `<div class="coursehead"><span class="cname">${esc(c)}</span>${
      chips ? `<span class="pastbar"><span class="pastlabel">Earlier</span>${chips}</span>` : ''}</div>`;

    if (lead.length) html += `<div class="decks">${lead.map(d => deckCard(d, true)).join('')}</div>`;

    /* A chapter holding a single deck gets no heading — it would only repeat
       what the deck title already says, and a stacked section of one wastes the
       width. They share a grid instead, so they sit side by side, and the
       "current" marker moves onto the card itself. */
    const bare = nowGroups.filter(g => inG(g).length === 1).map(g => inG(g)[0]).concat(looseNow);
    if (bare.length)
      html += `<div class="decks">${bare.map(d => deckCard(d, true)).join('')}</div>`;

    /* A chapter heading carries its own reset, because progress is per deck and
       a chapter is now six of them — clearing a chapter one deck at a time is
       the kind of chore that stops you doing it at all.

       It only appears once there is something to clear, so an untouched chapter
       shows no control and the row stays quiet. Nothing is offered that would
       do nothing. */
    const sect = (title, now, decks) => {
      const ids = decks.filter(d => (progress[d.id] || {}).last).map(d => d.id);
      return `<div class="sect">${esc(title)}${now ? '<span class="now">current</span>' : ''}${
        ids.length ? `<button type="button" class="reset" data-ids="${ids.join(' ')}"
          onclick="resetScores(this)">Reset scores</button>` : ''}</div>`;
    };

    nowGroups.filter(g => inG(g).length > 1).forEach(g => {
      html += sect(g, true, inG(g)) +
        `<div class="decks">${inG(g).map(d => deckCard(d, false)).join('')}</div>`;
    });

    panels.forEach(p => {
      html += `<div class="pastwrap" id="${p.id}"${p.open ? '' : ' hidden'}>${
        sect(p.label, false, p.decks)}<div class="decks">${
        p.decks.map(d => deckCard(d, false)).join('')}</div></div>`;
    });
  });

  app.innerHTML = html;
  const box = document.getElementById('search');
  box.oninput = e => { session = { q: e.target.value }; const pos = e.target.selectionStart; screenHome();
    const b = document.getElementById('search'); b.focus(); b.setSelectionRange(pos, pos); };
}

/* ═══════════════ DECK MENU ═══════════════ */
function screenDeck(){
  const d = deckById(view.deck);
  /* Only offer modes the deck can actually support — a procedure has no terms
     to flip or match, and a vocabulary list has no order to reconstruct. */
  const modes = [];
  if (d.steps.length)
    modes.push(['order','Put in Order','Rebuild the procedure one step at a time, in sequence.']);
  if (recallable(d).length)
    modes.push(['recall','Recall — Type It In','Read the definition, type the term, and get marked right or wrong on the spot.']);
  if (d.cards.length)
    modes.push(['learn','Flashcards','Flip through the terms and grade yourself. Missed cards come back around.']);
  if (d.cards.length || (d.questions || []).length)
    modes.push(['quiz','Multiple Choice','Written concept questions plus auto-generated term questions, with explanations.']);
  /* needs four cards to build a statement — below that every wrong pairing
     would come from the same tiny handful and the answer becomes guessable */
  if (d.cards.length >= 4)
    modes.push(['tf','True or False','A term paired with a definition — decide whether it belongs to it.']);
  /* needs four tracings, so the question has four choices to offer */
  if (tracedCards(d).length >= 4)
    modes.push(['trace','Name the Rhythm','Read the tracing and identify it — no definition given, just the strip.']);
  if (partCards(d).length >= 4)
    modes.push(['parts','Spot the Segment','A span of the cardiac cycle is marked on the tracing — say which one it is.']);
  if (d.cards.length)
    modes.push(['match','Matching','Pair each term with its definition against the clock, six at a time.']);
  if (d.chest)
    modes.push(['chest','Place the Electrodes','Click where each of the 10 electrodes goes — 4 limb and 6 chest.']);
  if (d.figure)
    modes.push(['figure','Label the Diagram',
      `Point to each of the ${d.figure.parts.length} structures on the diagram.`]);
  if (d.beat)
    modes.push(['beat','Watch a Heartbeat','See the impulse travel the conduction system while the ECG draws in step — then switch rhythms to compare the arrhythmias.']);
  modes.push(['browse','Review Sheet', d.steps.length
    ? 'The full procedure in order, with the rationale for each step.'
    : 'The whole list in one table. Hide the definitions to self-test.']);
  /* Only where the chapter actually spans more than this deck — otherwise it
     would just be the Review Sheet above under a grander name. */
  if (chapterDecks(d).length > 1)
    modes.push(['chapter', `Whole Chapter Sheet`,
      `Every term across all ${chapterDecks(d).length} ${d.group} decks in one table, labelled by source.`]);

  app.innerHTML = `
    <button class="back" onclick="go('home')">← All decks</button>
    <h2 class="title">${esc(d.title)}</h2>
    <div class="srcline">${esc(d.course)} · ${d.cards.length ? `${d.cards.length} terms` : `${d.steps.length} steps`}<br>from ${esc(d.source)}</div>
    <div class="modes">
      ${modes.map(([m,t,s]) => `<button class="mode" onclick="go('run','${d.id}','${m}')">
        <strong>${t}</strong><span>${s}</span></button>`).join('')}
    </div>`;
}

/* ═══════════════ FLASHCARDS ═══════════════ */
function runLearn(d){
  if (!session) session = { queue: shuffle(d.cards), done: 0, total: d.cards.length, flipped: false, mastered: new Set() };
  const s = session;

  if (!s.queue.length){
    record(d.id, { learned: s.mastered.size });
    return results(d, `${s.mastered.size}/${s.total}`, 'cards you got on the first try', [], 'learn');
  }

  const c = s.queue[0];
  const missed = s.seenAgain ? s.seenAgain.size : 0;
  app.innerHTML = `
    ${sessionBar(d, s.total - s.queue.length, s.total,
       `Flashcards · <span style="color:var(--good)">${s.mastered.size} got</span> · <span style="color:var(--bad)">${missed} to redo</span>`)}
    <div class="fc" onclick="flip()">
      <div class="side">${s.flipped ? 'Definition' : 'Term'}</div>
      ${s.flipped
        ? `<div class="def">${defHtml(c.def)}${c.note ? `<span class="note">${esc(c.note)}</span>` : ''}</div>`
        : `<div class="term">${esc(c.term)}</div>`}
      <div class="tap">${s.flipped ? 'How did you do?' : 'Click, tap, or press Space to flip'}</div>
    </div>
    ${s.flipped ? `<div class="grade">
        <button class="again" onclick="grade(false)">Again <span style="color:var(--dim)">(1)</span></button>
        <button class="ok" onclick="grade(true)">Got it <span style="color:var(--dim)">(2)</span></button>
      </div>` : ''}`;

  keyHandler = e => {
    if (!s.flipped && (e.key === ' ' || e.key === 'Enter')){ e.preventDefault(); flip(); }
    else if (s.flipped && (e.key === '1')) grade(false);
    else if (s.flipped && (e.key === '2' || e.key === ' ' || e.key === 'Enter')){ e.preventDefault(); grade(true); }
  };
}
function flip(){ session.flipped = true; render(); }
function grade(ok){
  const s = session, c = s.queue.shift();
  if (ok){ if (!s.seenAgain || !s.seenAgain.has(c)) s.mastered.add(c); }
  else { (s.seenAgain = s.seenAgain || new Set()).add(c);
         s.queue.splice(Math.min(4, s.queue.length), 0, c); }
  s.flipped = false;
  render();
}

/* ═══════════════ RECALL (type the answer, judged instantly) ═══════════════ */

/* Strip case, punctuation, slashes and any parenthetical aside, so that
   "abdomin/o", "Abdomino" and "abdomin o" all compare equal.
   Fraction glyphs are spelled out FIRST: "½" is not in [a-z0-9], so stripping
   it blind would reduce "Sensitivity ½" to "sensitivity" — accepting the bare
   word while rejecting the correct "Sensitivity 1/2". Nobody should have to
   type a glyph they cannot reach from the keyboard. */
const FRACTIONS = { '½': '1/2', '¼': '1/4', '¾': '3/4', '⅓': '1/3', '⅔': '2/3' };
const normalize = s => String(s)
  .replace(/[½¼¾⅓⅔]/g, m => FRACTIONS[m])
  .toLowerCase().replace(/\(.*?\)/g, '').replace(/[^a-z0-9]/g, '');

/* A card's term may list several acceptable forms ("-ac, -al, -ar…"): any one
   counts — and so does the whole string. Without the whole string, a term like
   "Pores, channels & carriers" is a single name that happens to contain a
   comma, and typing it exactly as displayed would be marked wrong. */
/* Every spelling that counts as this card's answer: the term itself, the parts
   of a term that lists two names ("Cell body, soma"), and any `also` aliases.

   `also` exists because a card's note would often say "Also called X" while
   Recall went on marking X wrong — the app itself teaching a name it refused to
   accept. Keeping aliases out of `term` matters: the term is what gets DISPLAYED
   in flashcards, matching and the review sheet, and "Free surface, apical
   surface, the exposed side..." reads as a card that cannot make up its mind. */
const alternatives = card =>
  [card.term, ...card.term.split(/,| or /i), ...(card.also || [])]
    .map(s => s.trim()).filter(Boolean);

/* A term ending in a category word that its own definition ALREADY supplies is
   redundant — "Hypogastric region" defined as "the region below the stomach".
   There the word tests typing, not knowledge, so the short form counts too.
   The definition is what makes it redundant: "Genetic mutation" is defined as
   "a change in the sequence of a DNA molecule", which never says mutation, so
   that one still needs its full name. */
const CATEGORY_TAIL =
  /\s+(regions?|cavit(?:y|ies)|planes?|tissues?|glands?|cells?|diseases?|disorders?|syndromes?|systems?|mutations?|transmission|orders?|directives?|valves?)$/i;
const shortForm = card => {
  const m = CATEGORY_TAIL.exec(card.term);
  if (!m) return null;
  /* compare on a short stem so cavity/cavities and region/regions both match */
  const stem = m[1].toLowerCase().slice(0, 5);
  if (!card.def.toLowerCase().includes(stem)) return null;
  return card.term.slice(0, m.index).trim();
};

/* 'exact' | 'wrong'. Every letter must be right — there is deliberately no typo
   tolerance. Medical terminology is full of pairs that differ by one or two
   letters and mean opposite things (hyper/hypo, -ostomy/-otomy, inter/intra),
   and spelling is graded, so a near-miss is a miss.
   Case, spacing and the /-o notation are still ignored: "abdomin/o", "Abdomino"
   and "abdomin o" are the same spelling, just written differently. */
/* Singular and plural are the same word, so "enzymes" for "enzyme" is not a
   spelling mistake — it is an inflection. Strict spelling still decides
   everything else: "enzime" and "enzymess" are both still wrong. Applied to
   both sides, so a card named in the plural accepts its singular too.
   Irregular plurals (nucleus/nuclei, bacterium/bacteria) are out of scope and
   simply fall through to strict matching. */
const deplural = w => w
  .replace(/ies$/, 'y')
  .replace(/(ss|[sxz]|ch|sh)es$/, '$1')
  .replace(/([^s])s$/, '$1');

function judge(input, card, deck){
  const n = normalize(input);
  if (!n) return 'wrong';
  if (alternatives(card).map(normalize).some(t => t && t === n)) return 'exact';

  /* Same guard as the short form: a plural only counts when nothing ELSE in the
     deck answers to it, so two cards can never take the same typed answer. */
  const p = deplural(n);
  if (p && alternatives(card).map(a => deplural(normalize(a))).some(t => t && t === p)){
    const taken = ((deck && deck.cards) || []).some(o => o !== card && (
      alternatives(o).map(normalize).some(t => t === n) ||
      alternatives(o).map(a => deplural(normalize(a))).some(t => t && t === p)));
    if (!taken) return 'exact';
  }

  /* Accept the short form only when nothing ELSE in the deck answers to it —
     neither another card's full name nor another card's short form.
     "Hypogastric region" → "Hypogastric" is safe. "Dorsal cavity" → "Dorsal" is
     not: Dorsal is its own card. "Genetic mutation" → "Genetic" is not either:
     Genetic disorder would shorten to the same thing. */
  const short = normalize(shortForm(card) || '');
  if (short && short === n){
    const taken = ((deck && deck.cards) || []).some(o => o !== card && (
      alternatives(o).map(normalize).some(t => t === n) ||
      normalize(shortForm(o) || '') === n));
    if (!taken) return 'exact';
  }
  return 'wrong';
}

/* A definition can describe a physiological event while the answer is the name
   of the WAVE that records it — "ventricular repolarization (relaxation)"
   honestly describes both the T wave and diastole, and only one is the term
   being asked for. Where a term declares its own category, Recall says which
   category it wants.

   This gives nothing away. The category word is part of the answer being typed,
   so naming it removes an ambiguity in the QUESTION without supplying any of
   the knowledge the card is testing. */
/* A rhythm is a SHAPE, and no wording of "erratic, jagged sawtooth" teaches you
   to recognise one on paper. Cards naming a rhythm draw its actual trace — the
   same paths the heartbeat animation uses, so there is one definition of each
   rhythm in the app rather than a picture that can drift from the animation. */
const traceOf = card => card.trace && RHYTHMS.find(r => r.name === card.trace);
const traceSvg = r => `<svg viewBox="0 0 400 90" class="ecg cardtrace" role="img"
    aria-label="ECG tracing">
  <line x1="0" y1="60" x2="400" y2="60" class="ecgbase"/>
  <path d="${r.path}" class="ecgtrace ${r.danger ? 'danger' : ''}"/>
</svg>`;

const ASK_CATEGORY = /\s(waves?|complex|intervals?|segments?|nodes?|valves?|axis)$/i;
const askFor = card => {
  const m = ASK_CATEGORY.exec(card.term);
  return m ? m[1].toLowerCase() : null;
};

function runRecall(d){
  const pool = recallable(d);
  if (!session) session = { queue: shuffle(pool), total: pool.length, right: 0, wrong: 0,
                            typed: '', verdict: null, missed: [], attempted: new Set() };
  const s = session;

  if (!s.queue.length){
    record(d.id, { recallBest: Math.max((load()[d.id] || {}).recallBest || 0,
                                        Math.round(s.right / s.total * 100)) });
    return results(d, `${s.right}/${s.total}`,
                   `correct on the first try · ${s.wrong} missed`, s.missed, 'recall');
  }

  const c = s.queue[0], v = s.verdict;
  const tone = v === 'wrong' ? 'var(--bad)' : 'var(--good)';

  app.innerHTML = `
    ${sessionBar(d, s.total - s.queue.length, s.total,
       `Recall · <span style="color:var(--good)">${s.right} correct</span> · <span style="color:var(--bad)">${s.wrong} missed</span>`)}
    <div class="q" style="font-weight:400">${
      askFor(c) ? `<span class="asks">Which ${esc(askFor(c))} —</span> ` : ''
    }${defHtml(c.def)}</div>
    ${traceOf(c) ? traceSvg(traceOf(c)) : ''}
    <input class="search" id="recall" autocomplete="off" autocapitalize="off" spellcheck="false"
      placeholder="${askFor(c) ? `Type the ${esc(askFor(c))}…` : 'Type the term…'}" value="${esc(s.typed)}" ${v ? 'disabled' : ''}
      style="${v ? `border-color:${tone}` : ''}">
    ${v ? `
      <div class="why" style="border-left-color:${tone}">
        <b style="color:${tone}">${v === 'exact' ? '✓ Correct' : '✗ Not quite'}</b><br>
        ${v === 'wrong' && s.typed.trim()
          ? `You typed: <b style="color:var(--bad)">${esc(s.typed.trim())}</b><br>` : ''}
        Answer: <b style="color:var(--text)">${esc(c.term)}</b>
        ${c.note ? `<span class="note">${esc(c.note)}</span>` : ''}
      </div>
      <button class="next" onclick="nextRecall()">
        ${s.queue.length > 1 ? 'Next card →' : 'See results →'}</button>`
    : `<div class="row" style="margin-top:12px">
        <button onclick="checkRecall()" style="border-color:var(--accent);color:var(--accent)">Check answer</button>
        <button onclick="revealRecall()">Show me</button>
      </div>`}`;

  const box = document.getElementById('recall');
  if (!v){
    box.focus();
    box.oninput = e => { s.typed = e.target.value; };
    box.onkeydown = e => { if (e.key === 'Enter'){ e.preventDefault(); checkRecall(); } };
  }
  keyHandler = e => { if (v && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); nextRecall(); } };
}
/* Only the FIRST attempt at a card moves the tally — a card you missed and then
   got right on its second pass shouldn't quietly inflate the score. */
function score(card, wrong){
  const s = session;
  if (s.attempted.has(card)) return;
  s.attempted.add(card);
  if (wrong){ s.wrong++; s.missed.push({ q: defHtml(card.def), a: card.term }); }
  else s.right++;
}
function checkRecall(){
  const s = session, c = s.queue[0];
  if (s.verdict || !s.typed.trim()) return;
  s.verdict = judge(s.typed, c, deckById(view.deck));
  score(c, s.verdict === 'wrong');
  render();
}
function revealRecall(){
  const s = session, c = s.queue[0];
  if (s.verdict) return;
  s.verdict = 'wrong';
  score(c, true);
  render();
}
function nextRecall(){
  const s = session, c = s.queue.shift();
  if (s.verdict === 'wrong') s.queue.splice(Math.min(5, s.queue.length), 0, c);
  s.typed = ''; s.verdict = null;
  render();
}

/* ═══════════════ MULTIPLE CHOICE ═══════════════ */
/* Two definitions "conflict" if one could pass for the other — identical, or one
   contained in the other ("lung" inside "air or lung"). A conflicting card must
   never become a distractor, or the question has two defensible answers. */
function conflicts(a, b){
  a = a.toLowerCase().trim(); b = b.toLowerCase().trim();
  return a === b || a.includes(b) || b.includes(a);
}
/* How much two definitions talk about the same thing, 0 to 1 (shared content
   words over total distinct content words). Used to pick wrong answers that sit
   in the same territory as the right one — drawing distractors at random makes
   three of the four choices obviously irrelevant, and the question answers
   itself without you knowing the material. */
const STOP = new Set(('the a an of to in and or is are be by with from that this it its as into ' +
  'through between over under out up down on at for not no other than then when which what where ' +
  'how each any all one two both same such more most less least very can does do has have had').split(' '));
/* Cached: the same handful of definitions get compared thousands of times while
   building a quiz, and re-splitting them each time is what makes it crawl. */
const WORDCACHE = new Map();
const contentWords = s => {
  let w = WORDCACHE.get(s);
  if (!w){
    w = new Set(String(s).toLowerCase()
      .replace(/<[^>]*>/g, ' ').replace(/[^a-z0-9\s-]/g, ' ').split(/\s+/)
      .filter(x => x.length >= 3 && !STOP.has(x)));
    WORDCACHE.set(s, w);
  }
  return w;
};
function similarity(a, b){
  const A = contentWords(a), B = contentWords(b);
  if (!A.size || !B.size) return 0;
  /* iterate the smaller set — the intersection is the same either way */
  const [S, L] = A.size <= B.size ? [A, B] : [B, A];
  let shared = 0;
  for (const w of S) if (L.has(w)) shared++;
  return shared / (A.size + B.size - shared);
}
/* Above this, a "wrong" answer is close enough to be arguable, and a study tool
   that marks a defensible answer wrong teaches the wrong thing. Related, not
   interchangeable, is the target. */
const TOO_CLOSE = 0.55;

/* Pick n wrong answers that clash with neither the right answer nor each other.
   Checking only against the right answer is not enough: mt2-parts has both
   path/o and -pathy meaning "disease, suffering, feeling, emotion", and neither
   clashes with, say, "before, front" — so both could be drawn, listing the same
   choice twice. Returns null when the deck can't supply n distinct options.

   `nearTo` is the right answer's definition. When given, candidates are ranked
   by how near they are to it and drawn from a shortlist of the nearest, so the
   choices stay in the same subject area. The shortlist is several times longer
   than the slots being filled, so repeat sittings do not serve the same three
   wrong answers every time. The full pool is appended as a fallback: a small
   deck, or one whose cards genuinely share no vocabulary, must still be able to
   fill four slots rather than produce no question at all. */
function distractors(pool, n, keyOf, taken, nearTo){
  let ranked = shuffle(pool);
  if (nearTo){
    const scored = pool.map(c => ({ c, s: similarity(nearTo, c.def) }));
    const usable = scored.filter(x => x.s <= TOO_CLOSE).sort((a, b) => b.s - a.s);
    /* shuffle within the shortlist: near, but not the same near every time */
    const short = shuffle(usable.slice(0, Math.max(n * 3, 9)).map(x => x.c));
    const rest  = shuffle(usable.slice(Math.max(n * 3, 9)).map(x => x.c));
    /* Anything above the threshold goes dead last, so it is only ever reached
       when the deck cannot fill four slots any other way. */
    const risky = shuffle(scored.filter(x => x.s > TOO_CLOSE).map(x => x.c));
    ranked = short.concat(rest, risky);
  }
  const out = [];
  for (const c of ranked){
    const k = keyOf(c);
    /* a card reached twice via the shortlist and the fallback is skipped here,
       because its own key is already sitting in `taken` */
    if (taken.some(t => conflicts(t, k))) continue;
    taken.push(k);
    out.push(c);
    if (out.length === n) return out;
  }
  return null;
}
function autoQuestions(d){
  const out = [];
  d.cards.forEach(card => {
    const pool = d.cards.filter(c => c !== card && !conflicts(c.def, card.def));
    if (pool.length < 3) return;

    /* Each question carries its source card so the quiz can avoid asking the
       same card twice — see runQuiz. */
    const fwd = distractors(pool, 3, c => c.def, [card.def], card.def);
    if (fwd){
      const ch = shuffle([card.def, ...fwd.map(c => c.def)]);
      /* "What does Parts of ATP mean?" reads badly — a fact card is a topic, so
         pose it as the topic itself. */
      const stem = card.fact
        ? `<b>${esc(card.term.replace(/\?$/, ''))}</b>?`
        : `What does <b>${esc(card.term)}</b> mean?`;
      out.push({ card, q: stem, choices: ch, answer: ch.indexOf(card.def), why: card.note });
    }

    /* Reverse direction only when no other card shares this meaning, otherwise
       "which term means X" would have more than one right answer. A fact card
       has no term to name, so it never gets a reverse question. */
    if (!card.fact && pool.length === d.cards.length - 1){
      /* Ranked on definitions even though the choices are terms: two terms are
         related when what they MEAN is related, which their names often do not
         show ("Tricuspid valve" and "Mitral valve" share no words at all). */
      const rev = distractors(pool, 3, c => c.term, [card.term], card.def);
      if (rev){
        const ch = shuffle([card.term, ...rev.map(c => c.term)]);
        out.push({ card, q:`Which term means: <em>${esc(card.def)}</em>`, choices: ch,
                   answer: ch.indexOf(card.term), why: card.note });
      }
    }
  });
  return out;
}
/* ═══════════════ LABELLED FIGURES ═══════════════ */
/* Drawn rather than sourced. An inline SVG costs a few kilobytes against the
   megabytes a textbook-quality raster would add, recolours itself for the light
   and dark themes, stays sharp at any zoom, and raises no copyright question.
   It is also the only version that can be CHECKED: the suite samples these
   paths and confirms every label sits inside the structure it names.

   ANTERIOR VIEW, so the patient's right is on your left — the same convention
   as the electrode figure. Schematic, not a dissection: the vessels are given
   separate territory rather than shown spiralling around one another, but every
   attachment, chamber and valve is where it belongs, and the aortic arch turns
   toward the patient's left as it does in life. */
/* The heart diagram is not mine. Hand-drawing anatomy without an illustrator's
   eye produced something unusable, so this is a real medical illustration:

     "Diagram of the human heart (clean)" by Wnauta, after Wapcaplet
     https://commons.wikimedia.org/wiki/File:Diagram_of_the_human_heart_(clean).svg
     Licensed CC BY-SA 3.0 - https://creativecommons.org/licenses/by-sa/3.0/

   Reused under that licence, which asks for credit and for the figure to stay
   under the same terms. The credit is rendered on screen beneath the diagram
   rather than buried in a comment, and repeated in the README.

   Changes made: the XML prolog, editor metadata and the fixed 650px width and
   height were stripped and a viewBox added so it scales. The artwork itself is
   untouched.

/* Read the aspect ratio straight out of the artwork's viewBox, so the box the
   labels are positioned against always matches the drawing inside it. Taking it
   from anywhere else is how the labels end up sliding off the picture. */
const figAspect = art => {
  const m = /viewBox="0 0 ([\d.]+) ([\d.]+)"/.exec(art);
  return m ? `${m[1]}/${m[2]}` : '1/1';
};

/* Also not mine. CC BY-SA 4.0, so the credit and the licence link are an
   obligation rather than a courtesy:

     "Human skin structure" by Tomas Kebert & umimeto.org
     https://commons.wikimedia.org/wiki/File:Human_skin_structure.svg
     CC BY-SA 4.0

   The author kept the labels in their own Inkscape layers, so removing them
   was a matter of dropping two groups rather than picking elements apart.
   Then cropped to the block itself — the labels left a wide empty gutter —
   and shrunk by rounding coordinates that ran to six decimal places, which at
   this size is under a fiftieth of a pixel: 406 KB down to 234 KB with nothing
   visibly changed.

   The defs block still carries entries nothing references, and they stay. An
   earlier pass removed them and silently deleted the sweat gland, because
   Inkscape chains its gradients — the one an element points at points in turn

const FIGURES = {
