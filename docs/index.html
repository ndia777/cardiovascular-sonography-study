/* ---------- storage ---------- */
const load = () => { try { return JSON.parse(localStorage.getItem(STORE)) || {}; } catch { return {}; } };
const save = o => { try { localStorage.setItem(STORE, JSON.stringify(o)); } catch {} };
function record(deckId, patch){
  const s = load();
  s[deckId] = Object.assign({}, s[deckId], patch, { last: Date.now() });
  save(s);
}

/* ---------- theme ---------- */
/* Dark by default — these get used at night. The toggle sticks once it's set. */
let theme = localStorage.getItem('cvs-theme') || 'dark';
document.documentElement.dataset.theme = theme;
function toggleTheme(){
  theme = theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = theme;
  localStorage.setItem('cvs-theme', theme);
  render();
}

/* ---------- helpers ---------- */
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const sample  = (a, n) => shuffle(a).slice(0, n);
/* Decks run oldest-first inside a course, so the list follows the order the
   material was actually covered rather than the order the file happens to be
   written in. Dates are ISO, so a plain string compare is a date compare.
   Decks added the same day keep their order in decks.js — sort is stable, so
   comparing dates alone preserves it. A deck with no date sorts last instead
   of throwing, and the test suite requires every deck to carry one. */
const byAdded = (a, b) => String(a.added || '9999-99-99').localeCompare(String(b.added || '9999-99-99'));
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* Definitions read as prose, so a trailing "Example: …" gets its own line and a
   label. Applied AFTER escaping, so the <br> is the only markup that survives.
   Used where a definition is read (recall, flashcards, review) — not in
   multiple-choice options or matching tiles, which stay compact. */
const defHtml = s => esc(s).replace(/\s*Example:\s*/g, '<br><span class="eg">Example:</span> ');
const deckById = id => DECKS.find(d => d.id === id);

let view = { screen:'home', deck:null, mode:null };
let session = null;              // live state for the active mode
let keyHandler = null;

function go(screen, deck, mode){
  view = { screen, deck, mode };
  session = null;
  window.scrollTo(0, 0);
  render();
}

/* ---------- score colour ----------

   A score badge is coloured by hue on the ordinary letter-grade scale: below 60
   red, then 60 / 70 / 80 / 90 as the D, C, B and A thresholds.

   The hue ramps CONTINUOUSLY between those anchors rather than each band having
   its own gradient. Per-band gradients look right until you reach an edge: if 79
   is the brightest amber and 80 the darkest green, then gaining a point makes
   the badge look worse. Here the colour only ever improves as the score rises,
   and the bands still read as distinct because the hue moves fastest as it
   crosses each threshold.

   Hue is the only thing that varies. Lightness and chroma are fixed per theme,
   in oklch, where equal lightness actually looks equal — in hsl the same
   lightness makes yellow glare and blue vanish, which is exactly the trap when
   a scale runs red to green through amber. The endpoints are tuned to the
   --bad and --good already in the palette, so these read as part of the theme
   rather than a second set of colours competing with it.

   Only percentages get this. The match time is in seconds and lower is better,
   so the same ramp would run backwards. */
const GRADE_ANCHORS = [[0, 25], [60, 48], [70, 78], [80, 112], [90, 150], [100, 156]];
function scoreHue(pct){
  const s = Math.max(0, Math.min(100, Number(pct) || 0));
  for (let i = 1; i < GRADE_ANCHORS.length; i++){
    const [s0, h0] = GRADE_ANCHORS[i - 1], [s1, h1] = GRADE_ANCHORS[i];
    if (s <= s1) return h0 + (h1 - h0) * ((s - s0) / (s1 - s0));
  }
  return GRADE_ANCHORS[GRADE_ANCHORS.length - 1][1];
}
/* The number stays on the badge, so the colour is a second reading of the same
   fact and never the only one — which is what makes a red/green scale safe. */
const scoreBadge = (label, pct) =>
  `<span class="badge scored" style="--sh:${scoreHue(pct).toFixed(1)}">${label} ${pct}%</span>`;

/* Clears every score in one chapter, in two clicks.

   Two clicks rather than a confirm dialog: a dialog is a heavier interruption
   than the action deserves, and it puts the destructive answer behind a button
   that says "OK", which is the least descriptive word available. Arming the
   control instead makes the second click say exactly what it does — and the
   armed state disarms itself after a few seconds, so a control left armed and
   forgotten cannot be triggered by a later, unrelated click.

   Only the decks that HAVE a score are listed in data-ids, so this never
   invents an entry for a deck that was never opened. */
let armedReset = null;
function disarmReset(){
  if (!armedReset) return;
  clearTimeout(armedReset.timer);
  if (armedReset.btn.isConnected){
    armedReset.btn.removeAttribute('data-armed');
    armedReset.btn.textContent = 'Reset scores';
  }
  armedReset = null;
}
function resetScores(btn){
  if (btn.dataset.armed !== '1'){
    disarmReset();
    btn.dataset.armed = '1';
    btn.textContent = 'Erase scores?';
    armedReset = { btn, timer: setTimeout(disarmReset, 5000) };
    return;
  }
  disarmReset();
  const s = load();
  (btn.dataset.ids || '').split(' ').filter(Boolean).forEach(id => { delete s[id]; });
  save(s);
  render();
}

/* Shows or hides one finished chapter. The chip and the panel are wired
   together by aria-controls/aria-expanded, so a screen reader announces the
   chip as the expandable thing it is; this is what <details> used to give for
   free, and it is the one thing worth keeping from it.

   The choice is remembered, so a chapter you keep going back to is not a click
   away every session. The boolean is stored rather than the key being deleted
   on close, so "I shut this deliberately" stays distinguishable from "never
   touched it" — otherwise a section that defaults open would spring back the
   moment the page reloaded. */
function togglePast(btn){
  const panel = document.getElementById(btn.getAttribute('aria-controls'));
  if (!panel) return;
  const open = btn.getAttribute('aria-expanded') !== 'true';
  btn.setAttribute('aria-expanded', String(open));
  panel.hidden = !open;
  const s = load(), o = Object.assign({}, s.__open);
  o[btn.dataset.key] = open;
  s.__open = o; save(s);
}

/* `exam` marks a deck as an official study guide — the instructor's, not notes
   worked up into one. `retired` says the chapter it belongs to is behind us.

   The two were one flag until the flag had to mean opposite things at once.
   `exam` was doing double duty: naming what a deck IS, and deciding that it
   gets pinned to the top in a yellow border. Putting a chapter away meant
   dropping the flag, which stripped the pinning as intended but also erased any
   trace that the deck had ever been a study guide — leaving a finished guide
   indistinguishable from a deck of notes.

   So `exam` now answers only "is this a study guide", which never stops being
   true, and `pinned` answers "does it lead its course", which stops the moment
   the chapter is retired. A retired guide keeps its badge, loses the border,
   and folds away with the chapter it came from. */
const pinned = d => !!d.exam && !d.retired;

/* ═══════════════ HOME ═══════════════ */
function screenHome(){
  const q = (session && session.q || '').toLowerCase();
  const progress = load();

  let list = DECKS;
  if (q) list = DECKS.filter(d =>
    (d.title + ' ' + d.course).toLowerCase().includes(q) ||
    d.cards.some(c => (c.term + ' ' + c.def).toLowerCase().includes(q)));

  /* Sections run alphabetically by SUBJECT, not by course code — "BIO101 ·
     Anatomy & Physiology" files under A — but a course being actively studied
     comes first as a tier.

     "Actively studied" means it holds a study guide OR a chapter marked
     current. Either alone is enough. Guides used to be the whole test, which
     broke the moment a chapter was retired: retiring a finished guide is how a
     chapter gets put away, so a course mid-chapter with its old guides retired
     scored zero and sank below courses nobody is taking this week. The chapter
     you are sitting in is the strongest signal there is that a course is live,
     and it now counts for at least as much as a guide.

     That rule, not a hardcoded exception, is what decides the order today.
     Pinning a course by name would go stale the moment its status changed, and
     would quietly stop making sense to anyone reading this later. Alphabetical
     still decides everything within a tier. */
  const subject = c => (c.split('·')[1] || c).trim();
  const isLive = c => list.some(d => d.course === c && (pinned(d) || d.current));
  const courses = [...new Set(list.map(d => d.course))]
    .sort((a, b) => (isLive(b) - isLive(a)) || subject(a).localeCompare(subject(b)));
  let html = `
    <header class="top">
      <div>
        <h1>Cardiovascular Sonography</h1>
        <div class="sub">${DECKS.length} decks · ${DECKS.reduce((n,d)=>n+d.cards.length,0)} terms · Term 1</div>
      </div>
      <div class="spacer"></div>
      <button class="iconbtn" onclick="toggleTheme()">${theme==='dark'?'☀ Light':'☾ Dark'}</button>
    </header>
    <input class="search" id="search" placeholder="Search decks or terms…" value="${esc(session&&session.q||'')}">`;

  if (!list.length) html += `<p style="color:var(--dim)">No decks match that search.</p>`;

  /* Study-guide decks lead each section — they are the tested material — and
     everything else folds away behind a disclosure so the page stays short as
     decks pile up. A course with no study guide of its own therefore collapses
     whole, down to its heading and a count; the decks are one click away and
     the section still reads as an index entry rather than a wall.

     While a search is running every fold is forced open, so a match can never
     hide inside a collapsed section. */
  const openState = load().__open || {};
  let panelSeq = 0;
  courses.forEach(c => {
    const inCourse = list.filter(d => d.course === c).sort(byAdded);
    const lead = inCourse.filter(pinned);
    const rest = inCourse.filter(d => !pinned(d));
    /* Whether anything in this course is spotlighted. A pinned guide and a
       current chapter both count as "something is already showing", which is
       what the folds below defer to when deciding whether to open. */
    const spotlit = rest.some(d => d.current);
    /* `bare` means the deck is rendered outside any section, so there is no
       heading above it to carry the "current" marker and the card must carry it
       itself. Inside a section the heading already says it, and repeating it on
       every card is just noise. */
    const deckCard = (d, bare) => {
      const p = progress[d.id] || {};
      const hits = q ? d.cards.filter(x => (x.term+' '+x.def).toLowerCase().includes(q)).length : 0;
      return `<button class="deck ${pinned(d) ? 'exam' : ''}" onclick="go('deck','${d.id}')">
        <h3>${esc(d.title)}</h3>
        <div class="meta">${d.cards.length ? `${d.cards.length} terms` : `${d.steps.length} steps`}${d.questions ? ` · ${d.questions.length} written questions` : ''}${hits ? ` · <span style="color:var(--accent)">${hits} match${hits>1?'es':''}</span>` : ''}</div>
        <div class="badges">
          ${d.exam ? `<span class="badge exam${d.retired ? ' past' : ''}">Study guide</span>` : ''}
          ${d.current && bare ? `<span class="badge now">Current</span>` : ''}
          ${p.recallBest != null ? scoreBadge('Recall', p.recallBest) : ''}
          ${p.quizBest != null ? scoreBadge('Quiz best', p.quizBest) : ''}
          ${p.tfBest != null ? scoreBadge('T/F', p.tfBest) : ''}
          ${p.traceBest != null ? scoreBadge('Rhythms', p.traceBest) : ''}
          ${p.partsBest != null ? scoreBadge('Segments', p.partsBest) : ''}
          ${p.figureBest != null ? scoreBadge('Diagram', p.figureBest) : ''}
          ${p.matchBest != null ? `<span class="badge on">Match ${p.matchBest}s</span>` : ''}
          ${p.learned ? `<span class="badge on">${p.learned} learned</span>` : ''}
          ${!p.last ? `<span class="badge">Not started</span>` : ''}
        </div></button>`;
    };

    /* Chapters split in two: the ones being studied now, which are simply on
       screen, and the ones already covered, which become chips on the course
       heading line.

       They used to be a stack of collapsed <details>, one row each. That row is
       charged whether or not you ever open it, so every finished chapter pushed
       the next course further down the page and the gap between subjects grew
       all term. Chips cost no rows at all — they ride on a line that is being
       drawn anyway — so a course takes the same vertical space with eight
       finished chapters as with none, and the page reads as what is current.
       Opening one drops its decks in below, laid out exactly as any other. */
    const inG = g => rest.filter(d => d.group === g);
    const isNow = g => inG(g).some(d => d.current);
    const byFirstAdded = (a, b) => (inG(a)[0].added || '').localeCompare(inG(b)[0].added || '');

    const groups = [...new Set(rest.map(d => d.group).filter(Boolean))].sort(byFirstAdded);
    const nowGroups = groups.filter(isNow);
    const pastGroups = groups.filter(g => !isNow(g));

    /* Ungrouped decks are nobody's chapter, so they get one chip of their own
       rather than being lost — unless one is current, in which case it belongs
       on screen with the rest of the current material. */
    const loose = rest.filter(d => !d.group);
    const looseNow = loose.filter(d => d.current);
    const loosePast = loose.filter(d => !d.current);

    /* A course that has never been organised opens its chapters, rather than
       presenting a row of chips and no decks at all — there is nothing for them
       to defer to yet.

       "Never organised" means no study guide has ever been pinned here and no
       chapter has ever been marked current. A RETIRED guide still counts: a
       course whose material has all been retired is finished, not untouched, and
       throwing it open again would undo the retiring. Testing only for a
       currently-pinned guide got this backwards — the moment the last guide in a
       course was retired, every chip in it sprang open. */
    const openByDefault = !inCourse.some(d => d.exam || d.current);

    const panels = [
      ...pastGroups.map(g => ({ key: `${c}/${g}`, label: g, decks: inG(g) })),
      ...(loosePast.length ? [{ key: `${c}/other`, label: `${loosePast.length} more deck${
        loosePast.length > 1 ? 's' : ''}`, decks: loosePast }] : []),
    ].map(p => Object.assign(p, {
      id: `past${panelSeq++}`,
      open: !!(q || (openState[p.key] === undefined ? openByDefault : openState[p.key])),
    }));

    const chips = panels.map(p =>
      `<button type="button" class="chip" data-key="${esc(p.key)}" aria-controls="${p.id}"
        aria-expanded="${p.open}" onclick="togglePast(this)">${esc(p.label)}</button>`).join('');

    html += `<div class="coursehead"><span class="cname">${esc(c)}</span>${
      chips ? `<span class="pastbar"><span class="pastlabel">Earlier</span>${chips}</span>` : ''}</div>`;

    if (lead.length) html += `<div class="decks">${lead.map(d => deckCard(d, true)).join('')}</div>`;

    /* A chapter holding a single deck gets no heading — it would only repeat
       what the deck title already says, and a stacked section of one wastes the
       width. They share a grid instead, so they sit side by side, and the
       "current" marker moves onto the card itself. */
    const bare = nowGroups.filter(g => inG(g).length === 1).map(g => inG(g)[0]).concat(looseNow);
    if (bare.length)
      html += `<div class="decks">${bare.map(d => deckCard(d, true)).join('')}</div>`;

    /* A chapter heading carries its own reset, because progress is per deck and
       a chapter is now six of them — clearing a chapter one deck at a time is
       the kind of chore that stops you doing it at all.

       It only appears once there is something to clear, so an untouched chapter
       shows no control and the row stays quiet. Nothing is offered that would
       do nothing. */
    const sect = (title, now, decks) => {
      const ids = decks.filter(d => (progress[d.id] || {}).last).map(d => d.id);
      return `<div class="sect">${esc(title)}${now ? '<span class="now">current</span>' : ''}${
        ids.length ? `<button type="button" class="reset" data-ids="${ids.join(' ')}"
          onclick="resetScores(this)">Reset scores</button>` : ''}</div>`;
    };

    nowGroups.filter(g => inG(g).length > 1).forEach(g => {
      html += sect(g, true, inG(g)) +
        `<div class="decks">${inG(g).map(d => deckCard(d, false)).join('')}</div>`;
    });

    panels.forEach(p => {
      html += `<div class="pastwrap" id="${p.id}"${p.open ? '' : ' hidden'}>${
        sect(p.label, false, p.decks)}<div class="decks">${
        p.decks.map(d => deckCard(d, false)).join('')}</div></div>`;
    });
  });

  app.innerHTML = html;
  const box = document.getElementById('search');
  box.oninput = e => { session = { q: e.target.value }; const pos = e.target.selectionStart; screenHome();
    const b = document.getElementById('search'); b.focus(); b.setSelectionRange(pos, pos); };
}

/* ═══════════════ DECK MENU ═══════════════ */
function screenDeck(){
  const d = deckById(view.deck);
  /* Only offer modes the deck can actually support — a procedure has no terms
     to flip or match, and a vocabulary list has no order to reconstruct. */
  const modes = [];
  if (d.steps.length)
    modes.push(['order','Put in Order','Rebuild the procedure one step at a time, in sequence.']);
  if (recallable(d).length)
    modes.push(['recall','Recall — Type It In','Read the definition, type the term, and get marked right or wrong on the spot.']);
  if (d.cards.length)
    modes.push(['learn','Flashcards','Flip through the terms and grade yourself. Missed cards come back around.']);
  if (d.cards.length || (d.questions || []).length)
    modes.push(['quiz','Multiple Choice','Written concept questions plus auto-generated term questions, with explanations.']);
  /* needs four cards to build a statement — below that every wrong pairing
     would come from the same tiny handful and the answer becomes guessable */
  if (d.cards.length >= 4)
    modes.push(['tf','True or False','A term paired with a definition — decide whether it belongs to it.']);
  /* needs four tracings, so the question has four choices to offer */
  if (tracedCards(d).length >= 4)
    modes.push(['trace','Name the Rhythm','Read the tracing and identify it — no definition given, just the strip.']);
  if (partCards(d).length >= 4)
    modes.push(['parts','Spot the Segment','A span of the cardiac cycle is marked on the tracing — say which one it is.']);
  if (d.cards.length)
    modes.push(['match','Matching','Pair each term with its definition against the clock, six at a time.']);
  if (d.chest)
    modes.push(['chest','Place the Electrodes','Click where each of the 10 electrodes goes — 4 limb and 6 chest.']);
  if (d.figure)
    modes.push(['figure','Label the Diagram',
      `Point to each of the ${d.figure.parts.length} structures on the diagram.`]);
  if (d.beat)
    modes.push(['beat','Watch a Heartbeat','See the impulse travel the conduction system while the ECG draws in step — then switch rhythms to compare the arrhythmias.']);
  modes.push(['browse','Review Sheet', d.steps.length
    ? 'The full procedure in order, with the rationale for each step.'
    : 'The whole list in one table. Hide the definitions to self-test.']);
  /* Only where the chapter actually spans more than this deck — otherwise it
     would just be the Review Sheet above under a grander name. */
  if (chapterDecks(d).length > 1)
    modes.push(['chapter', `Whole Chapter Sheet`,
      `Every term across all ${chapterDecks(d).length} ${d.group} decks in one table, labelled by source.`]);

  app.innerHTML = `
    <button class="back" onclick="go('home')">← All decks</button>
    <h2 class="title">${esc(d.title)}</h2>
    <div class="srcline">${esc(d.course)} · ${d.cards.length ? `${d.cards.length} terms` : `${d.steps.length} steps`}<br>from ${esc(d.source)}</div>
    <div class="modes">
      ${modes.map(([m,t,s]) => `<button class="mode" onclick="go('run','${d.id}','${m}')">
        <strong>${t}</strong><span>${s}</span></button>`).join('')}
    </div>`;
}

/* ═══════════════ FLASHCARDS ═══════════════ */
function runLearn(d){
  if (!session) session = { queue: shuffle(d.cards), done: 0, total: d.cards.length, flipped: false, mastered: new Set() };
  const s = session;

  if (!s.queue.length){
    record(d.id, { learned: s.mastered.size });
    return results(d, `${s.mastered.size}/${s.total}`, 'cards you got on the first try', [], 'learn');
  }

  const c = s.queue[0];
  const missed = s.seenAgain ? s.seenAgain.size : 0;
  app.innerHTML = `
    ${sessionBar(d, s.total - s.queue.length, s.total,
       `Flashcards · <span style="color:var(--good)">${s.mastered.size} got</span> · <span style="color:var(--bad)">${missed} to redo</span>`)}
    <div class="fc" onclick="flip()">
      <div class="side">${s.flipped ? 'Definition' : 'Term'}</div>
      ${s.flipped
        ? `<div class="def">${defHtml(c.def)}${c.note ? `<span class="note">${esc(c.note)}</span>` : ''}</div>`
        : `<div class="term">${esc(c.term)}</div>`}
      <div class="tap">${s.flipped ? 'How did you do?' : 'Click, tap, or press Space to flip'}</div>
    </div>
    ${s.flipped ? `<div class="grade">
        <button class="again" onclick="grade(false)">Again <span style="color:var(--dim)">(1)</span></button>
        <button class="ok" onclick="grade(true)">Got it <span style="color:var(--dim)">(2)</span></button>
      </div>` : ''}`;

  keyHandler = e => {
    if (!s.flipped && (e.key === ' ' || e.key === 'Enter')){ e.preventDefault(); flip(); }
    else if (s.flipped && (e.key === '1')) grade(false);
    else if (s.flipped && (e.key === '2' || e.key === ' ' || e.key === 'Enter')){ e.preventDefault(); grade(true); }
  };
}
function flip(){ session.flipped = true; render(); }
function grade(ok){
  const s = session, c = s.queue.shift();
  if (ok){ if (!s.seenAgain || !s.seenAgain.has(c)) s.mastered.add(c); }
  else { (s.seenAgain = s.seenAgain || new Set()).add(c);
         s.queue.splice(Math.min(4, s.queue.length), 0, c); }
  s.flipped = false;
  render();
}

/* ═══════════════ RECALL (type the answer, judged instantly) ═══════════════ */

/* Strip case, punctuation, slashes and any parenthetical aside, so that
   "abdomin/o", "Abdomino" and "abdomin o" all compare equal.
   Fraction glyphs are spelled out FIRST: "½" is not in [a-z0-9], so stripping
   it blind would reduce "Sensitivity ½" to "sensitivity" — accepting the bare
   word while rejecting the correct "Sensitivity 1/2". Nobody should have to
   type a glyph they cannot reach from the keyboard. */
const FRACTIONS = { '½': '1/2', '¼': '1/4', '¾': '3/4', '⅓': '1/3', '⅔': '2/3' };
const normalize = s => String(s)
  .replace(/[½¼¾⅓⅔]/g, m => FRACTIONS[m])
  .toLowerCase().replace(/\(.*?\)/g, '').replace(/[^a-z0-9]/g, '');

/* A card's term may list several acceptable forms ("-ac, -al, -ar…"): any one
   counts — and so does the whole string. Without the whole string, a term like
   "Pores, channels & carriers" is a single name that happens to contain a
   comma, and typing it exactly as displayed would be marked wrong. */
/* Every spelling that counts as this card's answer: the term itself, the parts
   of a term that lists two names ("Cell body, soma"), and any `also` aliases.

   `also` exists because a card's note would often say "Also called X" while
   Recall went on marking X wrong — the app itself teaching a name it refused to
   accept. Keeping aliases out of `term` matters: the term is what gets DISPLAYED
   in flashcards, matching and the review sheet, and "Free surface, apical
   surface, the exposed side..." reads as a card that cannot make up its mind. */
const alternatives = card =>
  [card.term, ...card.term.split(/,| or /i), ...(card.also || [])]
    .map(s => s.trim()).filter(Boolean);

/* A term ending in a category word that its own definition ALREADY supplies is
   redundant — "Hypogastric region" defined as "the region below the stomach".
   There the word tests typing, not knowledge, so the short form counts too.
   The definition is what makes it redundant: "Genetic mutation" is defined as
   "a change in the sequence of a DNA molecule", which never says mutation, so
   that one still needs its full name. */
const CATEGORY_TAIL =
  /\s+(regions?|cavit(?:y|ies)|planes?|tissues?|glands?|cells?|diseases?|disorders?|syndromes?|systems?|mutations?|transmission|orders?|directives?|valves?)$/i;
const shortForm = card => {
  const m = CATEGORY_TAIL.exec(card.term);
  if (!m) return null;
  /* compare on a short stem so cavity/cavities and region/regions both match */
  const stem = m[1].toLowerCase().slice(0, 5);
  if (!card.def.toLowerCase().includes(stem)) return null;
  return card.term.slice(0, m.index).trim();
};

/* 'exact' | 'wrong'. Every letter must be right — there is deliberately no typo
   tolerance. Medical terminology is full of pairs that differ by one or two
   letters and mean opposite things (hyper/hypo, -ostomy/-otomy, inter/intra),
   and spelling is graded, so a near-miss is a miss.
   Case, spacing and the /-o notation are still ignored: "abdomin/o", "Abdomino"
   and "abdomin o" are the same spelling, just written differently. */
/* Singular and plural are the same word, so "enzymes" for "enzyme" is not a
   spelling mistake — it is an inflection. Strict spelling still decides
   everything else: "enzime" and "enzymess" are both still wrong. Applied to
   both sides, so a card named in the plural accepts its singular too.
   Irregular plurals (nucleus/nuclei, bacterium/bacteria) are out of scope and
   simply fall through to strict matching. */
const deplural = w => w
  .replace(/ies$/, 'y')
  .replace(/(ss|[sxz]|ch|sh)es$/, '$1')
  .replace(/([^s])s$/, '$1');

function judge(input, card, deck){
  const n = normalize(input);
  if (!n) return 'wrong';
  if (alternatives(card).map(normalize).some(t => t && t === n)) return 'exact';

  /* Same guard as the short form: a plural only counts when nothing ELSE in the
     deck answers to it, so two cards can never take the same typed answer. */
  const p = deplural(n);
  if (p && alternatives(card).map(a => deplural(normalize(a))).some(t => t && t === p)){
    const taken = ((deck && deck.cards) || []).some(o => o !== card && (
      alternatives(o).map(normalize).some(t => t === n) ||
      alternatives(o).map(a => deplural(normalize(a))).some(t => t && t === p)));
    if (!taken) return 'exact';
  }

  /* Accept the short form only when nothing ELSE in the deck answers to it —
     neither another card's full name nor another card's short form.
     "Hypogastric region" → "Hypogastric" is safe. "Dorsal cavity" → "Dorsal" is
     not: Dorsal is its own card. "Genetic mutation" → "Genetic" is not either:
     Genetic disorder would shorten to the same thing. */
  const short = normalize(shortForm(card) || '');
  if (short && short === n){
    const taken = ((deck && deck.cards) || []).some(o => o !== card && (
      alternatives(o).map(normalize).some(t => t === n) ||
      normalize(shortForm(o) || '') === n));
    if (!taken) return 'exact';
  }
  return 'wrong';
}

/* A definition can describe a physiological event while the answer is the name
   of the WAVE that records it — "ventricular repolarization (relaxation)"
   honestly describes both the T wave and diastole, and only one is the term
   being asked for. Where a term declares its own category, Recall says which
   category it wants.

   This gives nothing away. The category word is part of the answer being typed,
   so naming it removes an ambiguity in the QUESTION without supplying any of
   the knowledge the card is testing. */
/* A rhythm is a SHAPE, and no wording of "erratic, jagged sawtooth" teaches you
   to recognise one on paper. Cards naming a rhythm draw its actual trace — the
   same paths the heartbeat animation uses, so there is one definition of each
   rhythm in the app rather than a picture that can drift from the animation. */
const traceOf = card => card.trace && RHYTHMS.find(r => r.name === card.trace);
const traceSvg = r => `<svg viewBox="0 0 400 90" class="ecg cardtrace" role="img"
    aria-label="ECG tracing">
  <line x1="0" y1="60" x2="400" y2="60" class="ecgbase"/>
  <path d="${r.path}" class="ecgtrace ${r.danger ? 'danger' : ''}"/>
</svg>`;

const ASK_CATEGORY = /\s(waves?|complex|intervals?|segments?|nodes?|valves?|axis)$/i;
const askFor = card => {
  const m = ASK_CATEGORY.exec(card.term);
  return m ? m[1].toLowerCase() : null;
};

function runRecall(d){
  const pool = recallable(d);
  if (!session) session = { queue: shuffle(pool), total: pool.length, right: 0, wrong: 0,
                            typed: '', verdict: null, missed: [], attempted: new Set() };
  const s = session;

  if (!s.queue.length){
    record(d.id, { recallBest: Math.max((load()[d.id] || {}).recallBest || 0,
                                        Math.round(s.right / s.total * 100)) });
    return results(d, `${s.right}/${s.total}`,
                   `correct on the first try · ${s.wrong} missed`, s.missed, 'recall');
  }

  const c = s.queue[0], v = s.verdict;
  const tone = v === 'wrong' ? 'var(--bad)' : 'var(--good)';

  app.innerHTML = `
    ${sessionBar(d, s.total - s.queue.length, s.total,
       `Recall · <span style="color:var(--good)">${s.right} correct</span> · <span style="color:var(--bad)">${s.wrong} missed</span>`)}
    <div class="q" style="font-weight:400">${
      askFor(c) ? `<span class="asks">Which ${esc(askFor(c))} —</span> ` : ''
    }${defHtml(c.def)}</div>
    ${traceOf(c) ? traceSvg(traceOf(c)) : ''}
    <input class="search" id="recall" autocomplete="off" autocapitalize="off" spellcheck="false"
      placeholder="${askFor(c) ? `Type the ${esc(askFor(c))}…` : 'Type the term…'}" value="${esc(s.typed)}" ${v ? 'disabled' : ''}
      style="${v ? `border-color:${tone}` : ''}">
    ${v ? `
      <div class="why" style="border-left-color:${tone}">
        <b style="color:${tone}">${v === 'exact' ? '✓ Correct' : '✗ Not quite'}</b><br>
        ${v === 'wrong' && s.typed.trim()
          ? `You typed: <b style="color:var(--bad)">${esc(s.typed.trim())}</b><br>` : ''}
        Answer: <b style="color:var(--text)">${esc(c.term)}</b>
        ${c.note ? `<span class="note">${esc(c.note)}</span>` : ''}
      </div>
      <button class="next" onclick="nextRecall()">
        ${s.queue.length > 1 ? 'Next card →' : 'See results →'}</button>`
    : `<div class="row" style="margin-top:12px">
        <button onclick="checkRecall()" style="border-color:var(--accent);color:var(--accent)">Check answer</button>
        <button onclick="revealRecall()">Show me</button>
      </div>`}`;

  const box = document.getElementById('recall');
  if (!v){
    box.focus();
    box.oninput = e => { s.typed = e.target.value; };
    box.onkeydown = e => { if (e.key === 'Enter'){ e.preventDefault(); checkRecall(); } };
  }
  keyHandler = e => { if (v && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); nextRecall(); } };
}
/* Only the FIRST attempt at a card moves the tally — a card you missed and then
   got right on its second pass shouldn't quietly inflate the score. */
function score(card, wrong){
  const s = session;
  if (s.attempted.has(card)) return;
  s.attempted.add(card);
  if (wrong){ s.wrong++; s.missed.push({ q: defHtml(card.def), a: card.term }); }
  else s.right++;
}
function checkRecall(){
  const s = session, c = s.queue[0];
  if (s.verdict || !s.typed.trim()) return;
  s.verdict = judge(s.typed, c, deckById(view.deck));
  score(c, s.verdict === 'wrong');
  render();
}
function revealRecall(){
  const s = session, c = s.queue[0];
  if (s.verdict) return;
  s.verdict = 'wrong';
  score(c, true);
  render();
}
function nextRecall(){
  const s = session, c = s.queue.shift();
  if (s.verdict === 'wrong') s.queue.splice(Math.min(5, s.queue.length), 0, c);
  s.typed = ''; s.verdict = null;
  render();
}

/* ═══════════════ MULTIPLE CHOICE ═══════════════ */
/* Two definitions "conflict" if one could pass for the other — identical, or one
   contained in the other ("lung" inside "air or lung"). A conflicting card must
   never become a distractor, or the question has two defensible answers. */
function conflicts(a, b){
  a = a.toLowerCase().trim(); b = b.toLowerCase().trim();
  return a === b || a.includes(b) || b.includes(a);
}
/* How much two definitions talk about the same thing, 0 to 1 (shared content
   words over total distinct content words). Used to pick wrong answers that sit
   in the same territory as the right one — drawing distractors at random makes
   three of the four choices obviously irrelevant, and the question answers
   itself without you knowing the material. */
const STOP = new Set(('the a an of to in and or is are be by with from that this it its as into ' +
  'through between over under out up down on at for not no other than then when which what where ' +
  'how each any all one two both same such more most less least very can does do has have had').split(' '));
/* Cached: the same handful of definitions get compared thousands of times while
   building a quiz, and re-splitting them each time is what makes it crawl. */
const WORDCACHE = new Map();
const contentWords = s => {
  let w = WORDCACHE.get(s);
  if (!w){
    w = new Set(String(s).toLowerCase()
      .replace(/<[^>]*>/g, ' ').replace(/[^a-z0-9\s-]/g, ' ').split(/\s+/)
      .filter(x => x.length >= 3 && !STOP.has(x)));
    WORDCACHE.set(s, w);
  }
  return w;
};
function similarity(a, b){
  const A = contentWords(a), B = contentWords(b);
  if (!A.size || !B.size) return 0;
  /* iterate the smaller set — the intersection is the same either way */
  const [S, L] = A.size <= B.size ? [A, B] : [B, A];
  let shared = 0;
  for (const w of S) if (L.has(w)) shared++;
  return shared / (A.size + B.size - shared);
}
/* Above this, a "wrong" answer is close enough to be arguable, and a study tool
   that marks a defensible answer wrong teaches the wrong thing. Related, not
   interchangeable, is the target. */
const TOO_CLOSE = 0.55;

/* Pick n wrong answers that clash with neither the right answer nor each other.
   Checking only against the right answer is not enough: mt2-parts has both
   path/o and -pathy meaning "disease, suffering, feeling, emotion", and neither
   clashes with, say, "before, front" — so both could be drawn, listing the same
   choice twice. Returns null when the deck can't supply n distinct options.

   `nearTo` is the right answer's definition. When given, candidates are ranked
   by how near they are to it and drawn from a shortlist of the nearest, so the
   choices stay in the same subject area. The shortlist is several times longer
   than the slots being filled, so repeat sittings do not serve the same three
   wrong answers every time. The full pool is appended as a fallback: a small
   deck, or one whose cards genuinely share no vocabulary, must still be able to
   fill four slots rather than produce no question at all. */
function distractors(pool, n, keyOf, taken, nearTo){
  let ranked = shuffle(pool);
  if (nearTo){
    const scored = pool.map(c => ({ c, s: similarity(nearTo, c.def) }));
    const usable = scored.filter(x => x.s <= TOO_CLOSE).sort((a, b) => b.s - a.s);
    /* shuffle within the shortlist: near, but not the same near every time */
    const short = shuffle(usable.slice(0, Math.max(n * 3, 9)).map(x => x.c));
    const rest  = shuffle(usable.slice(Math.max(n * 3, 9)).map(x => x.c));
    /* Anything above the threshold goes dead last, so it is only ever reached
       when the deck cannot fill four slots any other way. */
    const risky = shuffle(scored.filter(x => x.s > TOO_CLOSE).map(x => x.c));
    ranked = short.concat(rest, risky);
  }
  const out = [];
  for (const c of ranked){
    const k = keyOf(c);
    /* a card reached twice via the shortlist and the fallback is skipped here,
       because its own key is already sitting in `taken` */
    if (taken.some(t => conflicts(t, k))) continue;
    taken.push(k);
    out.push(c);
    if (out.length === n) return out;
  }
  return null;
}
function autoQuestions(d){
  const out = [];
  d.cards.forEach(card => {
    const pool = d.cards.filter(c => c !== card && !conflicts(c.def, card.def));
    if (pool.length < 3) return;

    /* Each question carries its source card so the quiz can avoid asking the
       same card twice — see runQuiz. */
    const fwd = distractors(pool, 3, c => c.def, [card.def], card.def);
    if (fwd){
      const ch = shuffle([card.def, ...fwd.map(c => c.def)]);
      /* "What does Parts of ATP mean?" reads badly — a fact card is a topic, so
         pose it as the topic itself. */
      const stem = card.fact
        ? `<b>${esc(card.term.replace(/\?$/, ''))}</b>?`
        : `What does <b>${esc(card.term)}</b> mean?`;
      out.push({ card, q: stem, choices: ch, answer: ch.indexOf(card.def), why: card.note });
    }

    /* Reverse direction only when no other card shares this meaning, otherwise
       "which term means X" would have more than one right answer. A fact card
       has no term to name, so it never gets a reverse question. */
    if (!card.fact && pool.length === d.cards.length - 1){
      /* Ranked on definitions even though the choices are terms: two terms are
         related when what they MEAN is related, which their names often do not
         show ("Tricuspid valve" and "Mitral valve" share no words at all). */
      const rev = distractors(pool, 3, c => c.term, [card.term], card.def);
      if (rev){
        const ch = shuffle([card.term, ...rev.map(c => c.term)]);
        out.push({ card, q:`Which term means: <em>${esc(card.def)}</em>`, choices: ch,
                   answer: ch.indexOf(card.term), why: card.note });
      }
    }
  });
  return out;
}

/* Read the aspect ratio straight out of the artwork's viewBox, so the box the
   labels are positioned against always matches the drawing inside it. Taking it
   from anywhere else is how the labels end up sliding off the picture. */
const figAspect = art => {
  const m = /viewBox="0 0 ([\d.]+) ([\d.]+)"/.exec(art);
  return m ? `${m[1]}/${m[2]}` : '1/1';
};

const FIGURES = {

function runFigure(d){
  const fig = d.figure, parts = fig.parts;
  if (!session) session = { order: shuffle(parts.map(p => p.id)), i: 0, score: 0, picked: null, missed: [] };
  const s = session;

  if (s.i >= s.order.length){
    const pct = Math.round(s.score / s.order.length * 100);
    const prev = load()[d.id] || {};
    record(d.id, { figureBest: Math.max(prev.figureBest || 0, pct) });
    return results(d, `${s.score}/${s.order.length}`, `of ${s.order.length} structures found`, s.missed, 'figure');
  }

  const target = s.order[s.i], done = s.picked !== null;
  const targetPart = parts.find(p => p.id === target);

  app.innerHTML = `
    ${sessionBar(d, s.i, s.order.length, `Label the Diagram · ${s.score} correct`)}
    <div class="q">Where is the <b>${esc(target)}</b>?</div>
    <div class="figure" style="aspect-ratio:${figAspect(FIGURES[fig.name].art)}">
      ${FIGURES[fig.name].art}
      <svg class="leaders" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
        ${parts.filter(p => p.to).map(p => {
          const lit = done && p.id === target;
          const dim = done && !lit && p.id !== s.picked;
          return `<line x1="${p.x}" y1="${p.y}" x2="${p.to[0]}" y2="${p.to[1]}"
            class="${lit ? 'on' : ''} ${dim ? 'off' : ''}"/>`;
        }).join('')}
      </svg>
      ${parts.map(p => {
        let cls = '';
        if (done && p.id === target) cls = 'correct';
        else if (done && p.id === s.picked) cls = 'wrong';
        else if (done) cls = 'muted';
        return `<button class="dot ${cls}" style="left:${p.x}%;top:${p.y}%"
          ${done ? 'disabled' : ''} onclick="pickPart('${esc(p.id)}')"
          aria-label="${esc(p.id)}"></button>`;
      }).join('')}
    </div>
    ${done ? `<div class="why"><b>${esc(target)}:</b> ${esc(targetPart.about)}</div>
      <button class="next" onclick="nextPart()">
        ${s.i + 1 < s.order.length ? 'Next structure →' : 'See results →'}</button>` : ''}
    <p class="figcap">${FIGURES[fig.name].caption}</p>
    <p class="figcredit">${FIGURES[fig.name].credit}</p>`;
  keyHandler = e => { if (done && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); nextPart(); } };
}
function pickPart(id){
  const s = session;
  if (s.picked !== null) return;
  s.picked = id;
  const target = s.order[s.i];
  if (id === target) s.score++;
  else s.missed.push({ q: `You pointed at <b>${esc(id)}</b>`, a: target });
  render();
}
function nextPart(){ session.i++; session.picked = null; render(); }

/* ═══════════════ NAME THE RHYTHM ═══════════════ */
/* Recognising a strip is the actual clinical skill, and it is not the same
   skill as reciting a definition — you can know that A-fib has no identifiable
   P wave and still not spot it on paper. This mode shows only the tracing.

   No image is fetched or embedded: these are the same SVG paths the heartbeat
   animation draws, whose rates and regularity are checked by the test suite.
   That also means no copyright question and no weight added to the file. */
const tracedCards = d => d.cards.filter(c => c.trace && traceOf(c));
function runTrace(d){
  if (!session){
    const pool = tracedCards(d);
    const qs = shuffle(pool).map(card => {
      /* wrong answers ranked by how close their definitions sit, so the choices
         are rhythms that could plausibly be confused rather than obvious misses */
      const others = pool.filter(c => c !== card && !conflicts(c.def, card.def));
      const wrong = distractors(others, 3, c => c.term, [card.term], card.def);
      if (!wrong) return null;
      const choices = shuffle([card.term, ...wrong.map(c => c.term)]);
      return { card, choices, answer: choices.indexOf(card.term) };
    }).filter(Boolean);
    session = { qs, i: 0, score: 0, picked: null, missed: [] };
  }
  const s = session;
  if (!s.qs.length) return screenDeck();

  if (s.i >= s.qs.length){
    const pct = Math.round(s.score / s.qs.length * 100);
    const prev = load()[d.id] || {};
    record(d.id, { traceBest: Math.max(prev.traceBest || 0, pct) });
    return results(d, pct + '%', `${s.score} of ${s.qs.length} identified`, s.missed, 'trace');
  }

  const q = s.qs[s.i], done = s.picked !== null;
  app.innerHTML = `
    ${sessionBar(d, s.i, s.qs.length, `Name the Rhythm · ${s.score} correct`)}
    <div class="q">Which rhythm is this?</div>
    ${traceSvg(traceOf(q.card))}
    <div class="choices">
      ${q.choices.map((c, i) => {
        let cls = '';
        if (done && i === q.answer) cls = 'correct';
        else if (done && i === s.picked) cls = 'wrong';
        return `<button class="choice ${cls}" ${done ? 'disabled' : ''} onclick="answerTrace(${i})">
          <span class="k">${done && i === q.answer ? '✓' : done && i === s.picked ? '✕' : 'ABCD'[i]}</span>
          <span>${esc(c)}</span></button>`;
      }).join('')}
    </div>
    ${done ? `<div class="why"><b>${esc(q.card.term)}</b> — ${defHtml(q.card.def)}
        ${q.card.note ? `<span class="note">${esc(q.card.note)}</span>` : ''}</div>
      <button class="next" onclick="nextTrace()">
        ${s.i + 1 < s.qs.length ? 'Next tracing →' : 'See results →'}</button>` : ''}`;

  keyHandler = e => {
    if (!done && '1234'.includes(e.key)) answerTrace(+e.key - 1);
    else if (!done && 'abcd'.includes(e.key.toLowerCase())) answerTrace('abcd'.indexOf(e.key.toLowerCase()));
    else if (done && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); nextTrace(); }
  };
}
function answerTrace(i){
  const s = session;
  if (s.picked !== null) return;
  s.picked = i;
  const q = s.qs[s.i];
  if (i === q.answer) s.score++;
  else s.missed.push({ q: `You said <b>${esc(q.choices[i])}</b>`, a: q.card.term });
  render();
}
function nextTrace(){ session.i++; session.picked = null; render(); }

/* ═══════════════ SPOT THE SEGMENT ═══════════════ */
/* Naming the parts of a complex is examined by pointing at one and asking what
   it is, so that is what this does: two beats drawn large, one span highlighted.

   The fractions below are the SAME ones pqrst() draws with, which is what keeps
   the highlight sitting exactly on the feature it claims. Change one without the
   other and the band drifts off the wave — the test suite checks they agree. */
const ECG_PARTS = [
  { term: 'P wave',       from: .10, to: .25 },
  { term: 'PR segment',   from: .25, to: .46 },
  { term: 'PR interval',  from: .10, to: .46 },
  { term: 'QRS complex',  from: .46, to: .62 },
  { term: 'ST segment',   from: .62, to: .72 },
  { term: 'T wave',       from: .72, to: .89 },
  { term: 'QT interval',  from: .46, to: .89 },
  { term: 'TP segment',   from: .89, to: 1.10 },
  { term: 'J point',      from: .60, to: .64 },
];
const partCards = d => ECG_PARTS
  .map(p => ({ part: p, card: d.cards.find(c => c.term.toLowerCase() === p.term.toLowerCase()) }))
  .filter(x => x.card);

const PARTW = 190;   /* one complex, in viewBox units */
function partsSvg(part){
  const a = PARTW * part.from, b = PARTW * part.to;
  return `<svg viewBox="0 0 400 100" class="ecg partsvg" role="img" aria-label="ECG tracing with one span highlighted">
    <rect class="parthi" x="${a.toFixed(1)}" y="4" width="${(b - a).toFixed(1)}" height="78"/>
    <line x1="0" y1="60" x2="400" y2="60" class="ecgbase"/>
    <path d="M0,60 ${pqrst(0, PARTW)}${pqrst(PARTW, PARTW)}" class="ecgtrace"/>
    <path class="partbar" d="M${a.toFixed(1)},90 L${a.toFixed(1)},95 L${b.toFixed(1)},95 L${b.toFixed(1)},90"/>
  </svg>`;
}
function runParts(d){
  if (!session){
    const pool = partCards(d);
    const qs = shuffle(pool).map(({ part, card }) => {
      const others = pool.filter(o => o.card !== card);
      if (others.length < 3) return null;
      const choices = shuffle([card.term, ...sample(others, 3).map(o => o.card.term)]);
      return { part, card, choices, answer: choices.indexOf(card.term) };
    }).filter(Boolean);
    session = { qs, i: 0, score: 0, picked: null, missed: [] };
  }
  const s = session;
  if (!s.qs.length) return screenDeck();

  if (s.i >= s.qs.length){
    const pct = Math.round(s.score / s.qs.length * 100);
    const prev = load()[d.id] || {};
    record(d.id, { partsBest: Math.max(prev.partsBest || 0, pct) });
    return results(d, pct + '%', `${s.score} of ${s.qs.length} identified`, s.missed, 'parts');
  }

  const q = s.qs[s.i], done = s.picked !== null;
  app.innerHTML = `
    ${sessionBar(d, s.i, s.qs.length, `Spot the Segment · ${s.score} correct`)}
    <div class="q">Which part of the cycle is marked?</div>
    ${partsSvg(q.part)}
    <div class="choices">
      ${q.choices.map((c, i) => {
        let cls = '';
        if (done && i === q.answer) cls = 'correct';
        else if (done && i === s.picked) cls = 'wrong';
        return `<button class="choice ${cls}" ${done ? 'disabled' : ''} onclick="answerParts(${i})">
          <span class="k">${done && i === q.answer ? '✓' : done && i === s.picked ? '✕' : 'ABCD'[i]}</span>
          <span>${esc(c)}</span></button>`;
      }).join('')}
    </div>
    ${done ? `<div class="why"><b>${esc(q.card.term)}</b> — ${defHtml(q.card.def)}
        ${q.card.note ? `<span class="note">${esc(q.card.note)}</span>` : ''}</div>
      <button class="next" onclick="nextParts()">
        ${s.i + 1 < s.qs.length ? 'Next tracing →' : 'See results →'}</button>` : ''}`;

  keyHandler = e => {
    if (!done && '1234'.includes(e.key)) answerParts(+e.key - 1);
    else if (!done && 'abcd'.includes(e.key.toLowerCase())) answerParts('abcd'.indexOf(e.key.toLowerCase()));
    else if (done && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); nextParts(); }
  };
}
function answerParts(i){
  const s = session;
  if (s.picked !== null) return;
  s.picked = i;
  const q = s.qs[s.i];
  if (i === q.answer) s.score++;
  else s.missed.push({ q: `You said <b>${esc(q.choices[i])}</b>`, a: q.card.term });
  render();
}
function nextParts(){ session.i++; session.picked = null; render(); }

/* ═══════════════ TRUE / FALSE ═══════════════ */
/* A statement pairs a term with a definition and asks whether they belong
   together. The false half is where the difficulty lives: pairing a term with a
   definition drawn at random makes every false statement obvious, so the wrong
   definition is chosen from the same subject area, exactly as quiz distractors
   are. `conflicts` still guards it — a definition that could honestly describe
   the term would make a "false" statement actually true. */
function tfStatements(d){
  const pool = d.cards;
  if (pool.length < 4) return [];
  return pool.map(card => {
    const others = pool.filter(c => c !== card && !conflicts(c.def, card.def));
    if (!others.length) return null;
    /* half true, half false, decided per card */
    if (Math.random() < 0.5)
      return { card, def: card.def, answer: true };
    const wrong = distractors(others, 1, c => c.def, [card.def], card.def);
    return wrong ? { card, def: wrong[0].def, answer: false, actually: wrong[0].term } : null;
  }).filter(Boolean);
}
function runTF(d){
  if (!session){
    const all = tfStatements(d);
    session = { qs: sample(all, Math.min(20, all.length)), i: 0, score: 0, picked: null, missed: [] };
  }
  const s = session;

  if (!s.qs.length) return screenDeck();
  if (s.i >= s.qs.length){
    const pct = Math.round(s.score / s.qs.length * 100);
    const prev = load()[d.id] || {};
    record(d.id, { tfBest: Math.max(prev.tfBest || 0, pct) });
    return results(d, pct + '%', `${s.score} of ${s.qs.length} correct`, s.missed, 'tf');
  }

  const q = s.qs[s.i], done = s.picked !== null;
  const right = done && s.picked === q.answer;
  app.innerHTML = `
    ${sessionBar(d, s.i, s.qs.length, `True or False · ${s.score} correct`)}
    <div class="q" style="font-weight:400"><b>${esc(q.card.term)}</b> means:<br>${defHtml(q.def)}</div>
    <div class="row tfrow">
      <button class="tf ${done && q.answer === true ? 'correct' : ''} ${done && s.picked === true && !right ? 'wrong' : ''}"
        ${done ? 'disabled' : ''} onclick="answerTF(true)">True</button>
      <button class="tf ${done && q.answer === false ? 'correct' : ''} ${done && s.picked === false && !right ? 'wrong' : ''}"
        ${done ? 'disabled' : ''} onclick="answerTF(false)">False</button>
    </div>
    ${done ? `<div class="why" style="border-left-color:${right ? 'var(--good)' : 'var(--bad)'}">
        <b style="color:${right ? 'var(--good)' : 'var(--bad)'}">${right ? '✓ Correct' : '✗ Not quite'}</b><br>
        ${q.answer
          ? `That is the definition of <b>${esc(q.card.term)}</b>.`
          : `That is the definition of <b>${esc(q.actually)}</b>. <b>${esc(q.card.term)}</b> means ${esc(q.card.def)}`}
        ${q.card.note ? `<span class="note">${esc(q.card.note)}</span>` : ''}
      </div>
      <button class="next" onclick="nextTF()">${s.i + 1 < s.qs.length ? 'Next statement →' : 'See results →'}</button>` : ''}`;

  keyHandler = e => {
    if (!done && (e.key === 't' || e.key === 'T' || e.key === '1')) answerTF(true);
    else if (!done && (e.key === 'f' || e.key === 'F' || e.key === '2')) answerTF(false);
    else if (done && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); nextTF(); }
  };
}
function answerTF(v){
  const s = session;
  if (s.picked !== null) return;
  s.picked = v;
  const q = s.qs[s.i];
  if (v === q.answer) s.score++;
  else s.missed.push({ q: `<b>${esc(q.card.term)}</b> means: ${esc(q.def)}`,
                       a: q.answer ? 'True' : `False — that defines ${q.actually}` });
  render();
}
function nextTF(){ session.i++; session.picked = null; render(); }

function runQuiz(d){
  if (!session){
    const written = (d.questions || []).map(q => Object.assign({}, q, { written: true }));

    /* A card can produce two questions — "what does X mean" and "which term
       means X" — and being asked both in one sitting reads as a duplicate.
       Keep a single randomly chosen direction per card. */
    const byCard = new Map();
    autoQuestions(d).forEach(q => {
      if (!byCard.has(q.card)) byCard.set(q.card, []);
      byCard.get(q.card).push(q);
    });
    let auto = [...byCard.values()].map(qs => qs[Math.random() * qs.length | 0]);

    /* Drop generated questions that land on the same answer as a hand-written
       one (e.g. a written "which term means abnormal narrowing?" alongside the
       generated version of the same thing). */
    const spokenFor = new Set(written.map(q => q.choices[q.answer]));
    auto = auto.filter(q => !spokenFor.has(q.choices[q.answer]));

    const n = Math.min(20, written.length + auto.length);
    const picked = shuffle(written).slice(0, n)
      .concat(sample(auto, Math.max(0, n - written.length)));
    session = { qs: shuffle(picked).slice(0, n), i: 0, score: 0, picked: null, missed: [] };
  }
  const s = session;

  if (s.i >= s.qs.length){
    const pct = Math.round(s.score / s.qs.length * 100);
    const prev = load()[d.id] || {};
    record(d.id, { quizBest: Math.max(prev.quizBest || 0, pct) });
    return results(d, pct + '%', `${s.score} of ${s.qs.length} correct`, s.missed, 'quiz');
  }

  const q = s.qs[s.i], done = s.picked !== null;
  app.innerHTML = `
    ${sessionBar(d, s.i, s.qs.length, `Quiz · ${s.score} correct`)}
    <div class="q">${q.q}</div>
    <div class="choices">
      ${q.choices.map((c, i) => {
        let cls = '';
        if (done && i === q.answer) cls = 'correct';
        else if (done && i === s.picked) cls = 'wrong';
        return `<button class="choice ${cls}" ${done ? 'disabled' : ''} onclick="answer(${i})">
          <span class="k">${done && i === q.answer ? '✓' : done && i === s.picked ? '✕' : 'ABCD'[i]}</span>
          <span>${esc(c)}</span></button>`;
      }).join('')}
    </div>
    ${done && q.why ? `<div class="why"><b>Why:</b> ${esc(q.why)}</div>` : ''}
    ${done ? `<button class="next" onclick="nextQ()">${s.i + 1 < s.qs.length ? 'Next question →' : 'See results →'}</button>` : ''}`;

  keyHandler = e => {
    if (!done && '1234'.includes(e.key)) answer(+e.key - 1);
    else if (!done && 'abcd'.includes(e.key.toLowerCase())) answer('abcd'.indexOf(e.key.toLowerCase()));
    else if (done && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); nextQ(); }
  };
}
function answer(i){
  const s = session, q = s.qs[s.i];
  if (s.picked !== null || i >= q.choices.length) return;
  s.picked = i;
  if (i === q.answer) s.score++;
  else s.missed.push({ q: q.q, a: q.choices[q.answer] });
  render();
}
function nextQ(){ session.i++; session.picked = null; render(); }

/* ═══════════════ MATCHING ═══════════════ */
function runMatch(d){
  if (!session){
    session = { pool: shuffle(d.cards), round: [], left: [], right: [], sel: null,
                matched: 0, total: d.cards.length, start: Date.now(), wrong: 0 };
    dealMatch();
  }
  const s = session;

  if (!s.round.length && !s.pool.length){
    const secs = Math.round((Date.now() - s.start) / 1000);
    const prev = load()[d.id] || {};
    record(d.id, { matchBest: prev.matchBest ? Math.min(prev.matchBest, secs) : secs });
    return results(d, secs + 's', `all ${s.total} pairs matched · ${s.wrong} misses`, [], 'match');
  }

  app.innerHTML = `
    ${sessionBar(d, s.matched, s.total, `Matching · ${s.wrong} misses`)}
    <div class="matchgrid">
      <div class="mcol">${s.left.map((c, i) => btnMatch(c, i, 'L')).join('')}</div>
      <div class="mcol">${s.right.map((c, i) => btnMatch(c, i, 'R')).join('')}</div>
    </div>`;
  keyHandler = null;
}
function btnMatch(c, i, side){
  const s = session, key = side + i;
  const cls = c.done ? 'done' : (s.sel === key ? 'sel' : '') + (s.badKey === key ? ' bad' : '');
  return `<button class="mitem ${cls}" ${c.done ? 'disabled' : ''} onclick="pick('${side}',${i})">
    ${esc(side === 'L' ? c.term : c.def)}</button>`;
}
function dealMatch(){
  const s = session;
  s.round = s.pool.splice(0, 6);
  s.left  = s.round.map(c => ({ term: c.term, def: c.def, id: c.term }));
  s.right = shuffle(s.left);
  s.sel = null;
}
function pick(side, i){
  const s = session, item = (side === 'L' ? s.left : s.right)[i], key = side + i;
  if (item.done) return;
  if (!s.sel){ s.sel = key; s.selItem = item; return render(); }
  if (s.sel === key){ s.sel = null; s.selItem = null; return render(); }
  if (s.sel[0] === side){ s.sel = key; s.selItem = item; return render(); }

  if (s.selItem.id === item.id){
    s.left.forEach(x => { if (x.id === item.id) x.done = true; });
    s.right.forEach(x => { if (x.id === item.id) x.done = true; });
    s.matched++;
    s.sel = null; s.selItem = null;
    if (s.left.every(x => x.done)){ if (s.pool.length) dealMatch(); else s.round = []; }
    render();
  } else {
    s.wrong++; s.badKey = key; render();
    setTimeout(() => { session.badKey = null; session.sel = null; session.selItem = null; render(); }, 320);
  }
}

/* ═══════════════ PLACE THE LEADS ═══════════════ */
/* Anterior figure, patient facing the viewer: the patient's LEFT is on our
   RIGHT. viewBox is 200x240, so a dot at SVG x=128,y=101 is left:64%, top:42%.
   Arms and legs are drawn because the four limb electrodes go on them.        */
const TORSO = `<svg viewBox="0 0 200 240" aria-hidden="true">
